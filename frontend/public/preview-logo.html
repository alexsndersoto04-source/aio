<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Logo Moon Preview</title>
  <style>
    body {
      background: #0d0e1b;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .caja {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .logo-moon {
      color: #818cf8;
      overflow: visible;
    }
    .logo-moon .logo-moon__aro {
      transform-box: view-box;
      transform-origin: 60px 52px;
      animation: logo-girar 14s linear infinite;
    }
    @keyframes logo-girar {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="caja">
    <svg class="logo-moon" width="120" height="120" viewBox="0 0 120 120">
      <defs>
        <linearGradient id="lunaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stopColor="currentColor" stopOpacity="1" />
          <stop offset="100%" stopColor="currentColor" stopOpacity="0.8" />
        </linearGradient>
      </defs>
      <g class="logo-moon__aro">
        <ellipse cx="60" cy="52" rx="47" ry="19" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" stroke-dasharray="95 18 25 18" transform="rotate(-26 60 52)" />
      </g>
      <path d="M 64 24 C 44 24 33 38 33 52 C 33 66 44 80 64 80 C 49 76 43 65 43 52 C 43 39 49 28 64 24 Z" fill="none" stroke="url(#lunaGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      <line x1="44" y1="98" x2="76" y2="98" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" />
      <circle cx="60" cy="104" r="1.2" fill="currentColor" opacity="0.8" />
    </svg>
    <div style="font-size: 24px; font-weight: 700; letter-spacing: -0.02em;">Moon</div>
  </div>
</body>
</html>
