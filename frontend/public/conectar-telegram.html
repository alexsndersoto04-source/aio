<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vincular Telegram a Moon</title>
  <style>
    body {
      background: #0d0e1b;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
    }
    .tarjeta {
      background: #17182b;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 28px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    }
    h2 { margin-top: 0; font-size: 20px; color: #818cf8; }
    p { font-size: 14px; color: #9ca3af; line-height: 1.5; }
    input, button {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: #090a14;
      color: #fff;
      font-size: 15px;
      margin-bottom: 12px;
      box-sizing: border-box;
    }
    button {
      background: #4f46e5;
      font-weight: 600;
      cursor: pointer;
      border: none;
      margin-top: 4px;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .resultado {
      background: #090a14;
      border: 1px solid #10b981;
      border-radius: 10px;
      padding: 14px;
      font-size: 13px;
      color: #34d399;
      word-break: break-all;
      margin-top: 14px;
      display: none;
    }
    .error {
      color: #f87171;
      font-size: 13px;
      margin-top: 8px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="tarjeta">
    <h2>Vincular Telegram a Moon</h2>
    <p>Conecta tus canales privados para almacenar fotos y videos de Moon sin límites.</p>

    <div id="paso1">
      <label style="font-size: 13px; color: #cbd5e1; display: block; margin-bottom: 6px;">Número de Telegram</label>
      <input type="text" id="telefono" value="+584246053395" placeholder="+58...">
      <button id="btnPedir" onclick="pedirCodigo()">Pedir código a Telegram</button>
    </div>

    <div id="paso2" style="display: none; margin-top: 14px;">
      <label style="font-size: 13px; color: #cbd5e1; display: block; margin-bottom: 6px;">Código de 5 dígitos recibido</label>
      <input type="text" id="codigo" placeholder="Ej: 12345" autocomplete="one-time-code">
      <label style="font-size: 12px; color: #94a3b8; display: block; margin-bottom: 4px;">Contraseña 2FA (solo si tu Telegram la tiene activada):</label>
      <input type="password" id="clave2fa" placeholder="Opcional">
      <button id="btnVerificar" onclick="verificarCodigo()">Confirmar y Generar Sesión</button>
    </div>

    <div id="mensajeError" class="error"></div>
    <div id="cajaResultado" class="resultado"></div>
  </div>

  <script>
    const API = 'https://moon-dal0.onrender.com';

    async function pedirCodigo() {
      const btn = document.getElementById('btnPedir');
      const err = document.getElementById('mensajeError');
      err.style.display = 'none';
      btn.disabled = true;
      btn.innerText = 'Conectando con Telegram...';

      try {
        const res = await fetch(`${API}/api/admin/telegram/enviar-codigo`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            phone: document.getElementById('telefono').value.trim(),
            api_id: 37564514,
            api_hash: '26564a3de304f28400a2c0eab6a14968'
          })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Error al conectar con Telegram');

        document.getElementById('paso1').style.display = 'none';
        document.getElementById('paso2').style.display = 'block';
        alert('¡Código enviado! Revisa tu Telegram y escríbelo aquí.');
      } catch (e) {
        err.innerText = e.message;
        err.style.display = 'block';
        btn.disabled = false;
        btn.innerText = 'Pedir código a Telegram';
      }
    }

    async function verificarCodigo() {
      const btn = document.getElementById('btnVerificar');
      const err = document.getElementById('mensajeError');
      const resCaja = document.getElementById('cajaResultado');
      err.style.display = 'none';
      btn.disabled = true;
      btn.innerText = 'Validando sesión...';

      try {
        const res = await fetch(`${API}/api/admin/telegram/verificar-codigo`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            code: document.getElementById('codigo').value.trim(),
            password: document.getElementById('clave2fa').value
          })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Código incorrecto o expirado');

        resCaja.style.display = 'block';
        resCaja.innerHTML = `<b>¡VINCULACIÓN EXITOSA!</b><br><br>Copia este texto y pégalo en Render como <b>TELEGRAM_SESSION</b>:<br><textarea style="width:100%;height:100px;margin-top:8px;background:#000;color:#34d399;font-size:11px;" readonly>${data.stringSession}</textarea>`;
        document.getElementById('paso2').style.display = 'none';
      } catch (e) {
        err.innerText = e.message;
        err.style.display = 'block';
        btn.disabled = false;
        btn.innerText = 'Confirmar y Generar Sesión';
      }
    }
  </script>
</body>
</html>
