<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Moon — red social</title>
    <meta name="description" content="Moon — una red social real: publicaciones, fotos, mensajes en vivo y más." />
    <meta name="theme-color" content="#f6f6f4" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%2317171c'/%3E%3Ccircle cx='11' cy='12' r='3.5' fill='%23d5d5da'/%3E%3Ccircle cx='20' cy='19' r='5.5' fill='%23f6f6f4'/%3E%3C/svg%3E" />
    <script>
      // Aplica el tema guardado antes de pintar: evita el destello blanco.
      (function () {
        try {
          var r = document.documentElement;
          var g = localStorage.getItem('moon_theme') || 'system';
          var oscuro = g === 'dark' || (g === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          r.dataset.theme = oscuro ? 'dark' : 'light';
          // Apariencia (vidrio, tamaño de letra, movimiento y densidad)
          var v = localStorage.getItem('moon_vidrio');
          r.dataset.vidrio = (v === 'suave' || v === 'intenso') ? v : 'normal';
          var t = localStorage.getItem('moon_texto');
          r.dataset.texto = (t === 'grande' || t === 'enorme') ? t : 'normal';
          r.dataset.movimiento = localStorage.getItem('moon_movimiento') === 'no' ? 'no' : 'si';
          r.dataset.denso = localStorage.getItem('moon_denso') === 'si' ? 'si' : 'no';
        } catch (e) { /* sin almacenamiento: se queda el tema claro */ }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
