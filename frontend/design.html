<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Moon · Sistema de diseño</title>
    <meta name="description" content="Galería de componentes del sistema de diseño de Moon (Órbita)." />
    <script>
      (function () {
        try {
          var g = localStorage.getItem('moon_theme') || 'system';
          var oscuro = g === 'dark' || (g === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = oscuro ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/design-preview.jsx"></script>
  </body>
</html>
