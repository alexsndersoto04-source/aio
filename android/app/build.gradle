plugins {
    id 'com.android.application'
}

android {
    namespace 'com.origen.game'
    compileSdk 34

    defaultConfig {
        applicationId "com.origen.game"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "0.1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug  // firma debug para que sea instalable; en producción usar keystore propio
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    // Sin dependencias de terceros: es una WebView que carga el juego desde assets.
}
