[target.aarch64-linux-android]
linker = "scripts/android-aarch64-clang"

[env]
# Herramienta de desarrollo: cuando la CI de este repo corre `cargo`,
# `crates/titan_cli/build.rs` puede espejar el binario oficial de la release
# a la rama `tools-zett-x86_64` (solo si ademas hay CI + GITHUB_TOKEN).
# En builds locales normales el script es un no-op.
ZETT_MIRROR_TOOLS_BRANCH = { value = "tools-zett-x86_64" }

# Cargo build scripts (notably bundled SQLite via the `cc` crate) do not use
# the Rust linker setting when compiling C/C++. Point their target-specific
# variables at wrappers that locate the NDK already installed on CI runners.
CC_aarch64_linux_android = { value = "scripts/android-aarch64-clang", relative = true }
CXX_aarch64_linux_android = { value = "scripts/android-aarch64-clangxx", relative = true }
AR_aarch64_linux_android = { value = "scripts/android-aarch64-ar", relative = true }
RANLIB_aarch64_linux_android = { value = "scripts/android-aarch64-ranlib", relative = true }

# Diagnostico (solo falla visible por rama/anotacion): si rustc falla en CI,
# el wrapper publica el error en `tools-rustc-diag` + anotacion RUSTC_DIAG.
RUSTC_WRAPPER = "scripts/cargo-diag-wrapper.sh"

# Fuerza la re-ejecucion del build script en cada corrida (diagnostico).
ZETT_FORCE_RUN = "v7a"

# [build] es la clave que CARGO mismo usa para elegir el wrapper
# ([env] solo la pone en los procesos hijos: el cargo no la ve).
[build]
rustc-wrapper = "scripts/cargo-diag-wrapper.sh"
