# Moon — despliegue gratuito y permanente
# ============================================================
# Un solo servicio: el servidor entrega la API y la aplicación web compilada,
# así todo vive en una dirección única y no hay que configurar dominios.
#
# Plan gratuito de Render + base de datos gratuita de Neon (no piden tarjeta).
# Pasos detallados, en lenguaje llano: ver DESPLEGAR.md en la raíz del proyecto.

services:
  - type: web
    name: moon
    runtime: node
    plan: free
    buildCommand: >-
      npm --prefix frontend ci &&
      npm --prefix frontend run build &&
      npm --prefix projects/moon/server ci --omit=dev
    startCommand: node projects/moon/server/src/index.mjs
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Secreto de las sesiones: Render lo inventa solo.
      - key: JWT_SECRET
        generateValue: true
      # Cadena de conexión de la base de datos (Supabase o Neon). Se pega a
      # mano al crear el servicio; no se guarda en el repositorio.
      - key: DATABASE_URL
        sync: false
      # Base secundaria de respaldo / failover automático (Supabase o Neon).
      - key: DATABASE_URL_BACKUP
        sync: false
      # Cualquier origen: la aplicación se sirve desde el mismo servicio.
      - key: CORS_ORIGIN
        value: "*"
      # Carpeta del sitio ya compilado (la crea el paso de compilación).
      - key: MOON_WEB_DIR
        value: /opt/render/project/src/frontend/dist
      # Carpeta de caché rápida de fotos y audios. El almacenamiento
      # permanente e ilimitado de multimedia es 100% gestionado por Telegram.
      # Correo (recuperación de contraseña, códigos y copia de seguridad
      # diaria). Basta con pegar aquí la clave gratuita de Resend.
      - key: RESEND_API_KEY
        sync: false
      # Remitente de los correos. Con Resend gratis se usa onboarding@resend.dev
      # hasta que se verifique un dominio propio.
      - key: MAIL_FROM
        value: Moon <onboarding@resend.dev>
      # Desde dónde se generan los enlaces de los correos.
      - key: PUBLIC_BASE_URL
        sync: false
      - key: MOON_UPLOADS
        value: /opt/render/project/src/uploads
      # Canario de despliegue: si aparece en /api/health, confirma que este
      # servicio se vuelve a publicar solo al subir código a esta rama y que
      # Render aplica las variables de este archivo. (Sin secretos.)
      - key: MOON_CANARIO
        value: canario-20260917-a
