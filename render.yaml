# Moon — despliegue gratuito y permanente
# ============================================================
# Un solo servicio: el servidor entrega la API y la aplicación web compilada,
# así todo vive en una dirección única y no hay que configurar dominios.
#
# Plan gratuito de Render + base de datos gratuita de Neon (no piden tarjeta).
# Pasos detallados, en lenguaje llano: ver DESPLEGAR.md en la raíz del proyecto.

services:
  - type: web
    name: moon
    runtime: node
    plan: free
    buildCommand: >-
      npm --prefix frontend ci &&
      npm --prefix frontend run build &&
      npm --prefix projects/moon/server ci --omit=dev
    startCommand: node projects/moon/server/src/index.mjs
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Secreto de las sesiones: Render lo inventa solo.
      - key: JWT_SECRET
        generateValue: true
      # Cadena de conexión de Neon (se pega a mano al crear el servicio).
      - key: DATABASE_URL
        sync: false
      # Cualquier origen: la aplicación se sirve desde el mismo servicio.
      - key: CORS_ORIGIN
        value: "*"
      # Carpeta del sitio ya compilado (la crea el paso de compilación).
      - key: MOON_WEB_DIR
        value: /opt/render/project/src/frontend/dist
      # Fotos subidas. En el plan gratuito el disco es temporal: se pierden al
      # reiniciar. (La siguiente mejora es guardarlas en la base de datos.)
      - key: MOON_UPLOADS
        value: /opt/render/project/src/uploads
