<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cargando TITAN…</title>
  <style>
    body { max-width: 48rem; margin: 4rem auto; padding: 0 1rem; font: 1.1rem system-ui; }
    #status { padding: 1rem; border: 1px solid #888; border-radius: .5rem; }
    #status.ready { border-color: #16803a; background: #eaf8ee; }
    #status.clicked { border-color: #5942c7; background: #f0edff; }
    button { padding: .65rem 1rem; font: inherit; cursor: pointer; }
    canvas { display: block; max-width: 100%; border-radius: .5rem; }
  </style>
</head>
<body>
  <h1>TITAN WebAssembly + DOM</h1>
  <canvas id="scene" width="640" height="240" aria-label="Escena dibujada por TITAN"></canvas>
  <p id="status">Cargando módulo…</p>
  <pre id="response">Esperando fetch asíncrono…</pre>
  <p><label>Mensaje para TITAN: <input id="message" type="text" autocomplete="off"></label></p>
  <button id="action" type="button">Ejecutar handler TITAN</button>
  <p><label>Echo WebSocket: <input id="socket-url" type="url" placeholder="wss://servidor/echo"></label></p>
  <p id="socket-state">Introduce una URL y pulsa Enter para conectar.</p>
  <script type="module" src="./host.js"></script>
</body>
</html>
