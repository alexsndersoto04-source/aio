[package]
name = "titan_stdlib"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["extras"]
# Meta-feature that bundles all optional modules. Turn off if you need
# the smallest possible zett binary.
extras = [
    # Phase 1 — fundamentals
    "regex_mod", "uuid_mod", "hash_mod", "random_mod", "datetime_mod", "url_mod", "dirs_mod",
    # Phase 2 — formats & compression
    "compress_mod", "archive_mod", "yaml_mod", "xml_mod",
    # Phase 3 — advanced networking
    "http_full_mod", "dns_mod", "email_mod",
    # Phase 4 — modern cryptography
    "crypto_mod", "password_mod", "jwt_mod",
    # Phase 5 — Termux / Android integration
    "termux_mod",
    # Phase 6 — Terminal & TUI
    "term_mod", "readline_mod", "progress_mod",
    # Phase 7 — Images & QR codes
    "image_mod", "qrcode_mod",
    # Phase 8 — System & OS
    "procfs_mod", "fswatch_mod", "signals_mod",
    # Phase 9 — Audio
    "audio_mod",
    # Phase 10 — NoSQL key-value + Redis
    "kv_mod", "redis_mod",
    # Phase 11 — HTTP server + URL router (axum-style)
    "server_mod", "router_mod",
    # Phase 14 — Charts (SVG line/bar/scatter/histogram)
    "plot_mod",
    # Phase 12 — Local AI: HuggingFace tokenizers (pure-Rust build)
    "tokenize_mod",
    # Phase 12 part 2 — Local AI: ONNX inference (tract, pure-Rust)
    "onnx_mod",
    # Phase 13' — Wi-Fi introspection via termux-wifi-* (Termux:API)
    "wifi_mod",
    # Phase 12 pt.4 — Vector math for embeddings + semantic search.
    "vector_mod",
]

# Phase 1
regex_mod    = ["dep:regex"]
uuid_mod     = ["dep:uuid"]
hash_mod     = ["dep:sha2", "dep:sha3", "dep:blake3", "dep:hmac"]
random_mod   = ["dep:rand", "dep:rand_chacha"]
datetime_mod = ["dep:chrono"]
url_mod      = ["dep:url"]
dirs_mod     = ["dep:dirs"]

# Phase 2 — formats & compression
compress_mod = ["dep:flate2", "dep:zstd"]
archive_mod  = ["dep:tar", "dep:zip"]
yaml_mod     = ["dep:serde_yaml"]
xml_mod      = ["dep:quick-xml"]

# Phase 3 — advanced networking
http_full_mod = ["dep:ureq", "dep:base64"]
dns_mod       = ["dep:hickory-resolver", "dep:tokio", "dep:once_cell"]
email_mod     = ["dep:lettre", "dep:tokio", "dep:once_cell"]

# Phase 4 — modern cryptography
crypto_mod   = ["dep:chacha20poly1305", "dep:aes-gcm", "dep:rand"]
password_mod = ["dep:argon2", "dep:bcrypt"]
jwt_mod      = ["dep:jsonwebtoken"]

# Phase 5 — Termux / Android integration (pure std, shells out to termux-api)
termux_mod   = []

# Phase 6 — Terminal & TUI (pure Rust, tiny footprint, Termux friendly)
term_mod     = ["dep:crossterm"]
readline_mod = ["dep:rustyline"]
progress_mod = ["dep:indicatif"]

# Phase 7 — Images & QR codes
image_mod    = ["dep:image"]
qrcode_mod   = ["dep:qrcode", "dep:image"]

# Phase 8 — System & OS
procfs_mod   = ["dep:sysinfo"]
fswatch_mod  = ["dep:notify"]
signals_mod  = ["dep:signal-hook"]

# Phase 9 — Audio (WAV read/write + synthesis; playback via termux-media-player)
audio_mod    = ["dep:hound"]

# Phase 10 — Embedded key-value store and Redis client
kv_mod       = ["dep:sled"]
redis_mod    = ["dep:redis"]

# Phase 11 — HTTP server (tiny_http) + URL router (matchit, same as axum)
server_mod   = ["dep:tiny_http"]
router_mod   = ["dep:matchit"]

# Phase 14 — Charts (SVG only, ttf/font-kit DISABLED to avoid the
# freetype-sys / fontconfig C-deps that would break Termux builds).
plot_mod     = ["dep:plotters"]

# Phase 12 — HuggingFace tokenizers, pure-Rust build (no onig, no C++).
tokenize_mod = ["dep:tokenizers"]

# Phase 12 part 2 — ONNX inference via tract (Sonos' inference engine).
onnx_mod     = ["dep:tract-onnx"]

# Phase 13' — Wi-Fi introspection. No new dep: uses serde_json + std::Command
# to shell out to the termux-wifi-* CLIs that ship with Termux:API.
wifi_mod     = []

# Phase 12 pt.4 — Vector math (pure Rust, no deps). For semantic search
# on top of std::onnx::run_bert_pooled embeddings.
vector_mod   = []

[dependencies]
titan_tls = { path = "../titan_tls" }
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
sha1 = "0.10"
getrandom = "0.3"

# Phase 1 — optional, activated via features
regex        = { version = "1", optional = true, default-features = false, features = ["std", "perf", "unicode"] }
uuid         = { version = "1", optional = true, default-features = false, features = ["std", "v4", "v7"] }
sha2         = { version = "0.10", optional = true }
sha3         = { version = "0.10", optional = true }
blake3       = { version = "1", optional = true, default-features = false, features = ["std"] }
hmac         = { version = "0.12", optional = true }
rand         = { version = "0.9", optional = true, default-features = false, features = ["std", "std_rng", "os_rng", "thread_rng"] }
rand_chacha  = { version = "0.9", optional = true }
chrono       = { version = "0.4", optional = true, default-features = false, features = ["clock", "serde"] }
url          = { version = "2", optional = true }
dirs         = { version = "5", optional = true }

# Phase 2 — formats & compression
flate2       = { version = "1", optional = true }
zstd         = { version = "0.13", optional = true, default-features = false }
tar          = { version = "0.4", optional = true }
zip          = { version = "2", optional = true, default-features = false, features = ["deflate"] }
serde_yaml   = { version = "0.9", optional = true }
quick-xml    = { version = "0.36", optional = true, features = ["serialize"] }

# Phase 3 — advanced networking (all pure-Rust, TLS via rustls, Termux friendly)
ureq              = { version = "2", optional = true, default-features = false, features = ["tls", "json", "gzip"] }
hickory-resolver  = { version = "0.24", optional = true, default-features = false, features = ["system-config", "tokio-runtime"] }
# lettre's `rustls-tls` feature already pulls webpki-roots + ring; do NOT
# add `aws-lc-rs`, which would drag aws-lc-sys back in.
lettre            = { version = "0.11", optional = true, default-features = false, features = ["smtp-transport", "rustls-tls", "builder"] }
base64            = { version = "0.22", optional = true }
tokio             = { version = "1", optional = true, features = ["rt", "net"] }
once_cell         = { version = "1", optional = true }

# Phase 4 — modern cryptography (all pure-Rust, no C deps)
chacha20poly1305  = { version = "0.10", optional = true }
aes-gcm           = { version = "0.10", optional = true }
argon2            = { version = "0.5", optional = true }
bcrypt            = { version = "0.15", optional = true }
jsonwebtoken      = { version = "9", optional = true }

# Phase 6 — Terminal & TUI (all pure-Rust, work under Termux)
crossterm         = { version = "0.28", optional = true }
rustyline         = { version = "14",   optional = true, default-features = false, features = ["with-file-history"] }
indicatif         = { version = "0.17", optional = true }

# Phase 7 — Images & QR codes (limit `image` to codecs we really use so the
# Termux build stays lean).
image             = { version = "0.25", optional = true, default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif"] }
qrcode            = { version = "0.14", optional = true, default-features = false, features = ["image", "svg"] }

# Phase 8 — System & OS (all pure Rust, no C deps, work on Termux/Android).
sysinfo           = { version = "0.32", optional = true, default-features = false, features = ["system", "disk", "network", "component"] }
notify            = { version = "6",    optional = true }
signal-hook       = { version = "0.3",  optional = true }

# Phase 9 — Audio.
# `hound` is pure Rust and reads/writes any PCM WAV without native deps.
# Playback is delegated to `termux-media-player` (from termux-api) so we
# never link against ALSA/AAudio (which would break in a stock Termux build).
hound             = { version = "3.5",  optional = true }

# Phase 10 — Embedded key-value store + Redis client.
# `sled` is pure-Rust, ACID, and produces a single on-disk file — perfect
# for caches, sessions and app config without spinning up a database.
# `redis` uses blocking sockets (no async runtime added); TLS off by
# default to keep the Termux build lean — plain redis:// is enough for
# 99% of use cases (Upstash / Redis Cloud terminate TLS at the edge).
sled              = { version = "0.34", optional = true }
redis             = { version = "0.27", optional = true, default-features = false }

# Phase 11 — Web server + router.
# `tiny_http` is a pure-Rust, blocking HTTP/1.1 server. Default features
# only (NO ssl/openssl/rustls) — Termux gets a plain listener; put a
# real reverse-proxy in front for TLS.
# `matchit` is the zero-copy radix-tree router used by axum internally.
tiny_http         = { version = "0.12", optional = true, default-features = false }
matchit           = { version = "0.8",  optional = true }

# Phase 14 — Plotters (SVG-only build).
# Turning off `ttf` / `font-kit` avoids freetype-sys / expat-sys /
# fontconfig, all of which are C-deps that either fail to build on
# Termux or blow up the disk. SVG text is rendered by the viewer.
plotters          = { version = "0.3",  optional = true, default-features = false, features = ["svg_backend", "line_series", "point_series", "area_series", "histogram", "colormaps", "full_palette"] }

# Phase 12 — HuggingFace tokenizers.
# DEFAULTS DISABLED to keep Termux happy:
#   * `progressbar` (pulls indicatif — we already have it in Phase 6)
#   * `onig`        (C library — Oniguruma regex — replaced by pure-Rust
#                    `fancy-regex` which properly overrides SysRegex from
#                    tokenizers 0.22 onwards)
#   * `esaxx_fast`  (C++ suffix-array — the pure-Rust `esaxx-rs` fallback
#                    that ships as an unconditional dep works fine for
#                    Unigram / BPE / WordPiece)
# tokenizers >= 0.22 gates SysRegex on `fancy-regex XOR onig` and emits a
# compile_error!() if you enable neither, so we can trust the mutex.
tokenizers        = { version = "0.22", optional = true, default-features = false, features = ["fancy-regex"] }

# Phase 12 part 2 — tract-onnx (Sonos' pure-Rust inference engine).
# No optional features to enable/disable here: `tract-onnx` 0.21 is 100%
# Rust with no C dependencies. It brings its own protobuf reader (`prost`),
# its own ndarray fork (`tract-ndarray`), and its own optimizer. Perfect
# fit for embedded / Termux use.
tract-onnx        = { version = "0.21", optional = true, default-features = false }
