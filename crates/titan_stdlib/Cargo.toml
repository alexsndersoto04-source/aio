[package]
name = "titan_stdlib"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["extras"]
# Meta-feature that bundles all optional modules. Turn off if you need
# the smallest possible zett binary.
extras = [
    # Phase 1 — fundamentals
    "regex_mod", "uuid_mod", "hash_mod", "random_mod", "datetime_mod", "url_mod", "dirs_mod",
    # Phase 2 — formats & compression
    "compress_mod", "archive_mod", "yaml_mod", "xml_mod",
    # Phase 3 — advanced networking
    "http_full_mod", "dns_mod", "email_mod",
]

# Phase 1
regex_mod    = ["dep:regex"]
uuid_mod     = ["dep:uuid"]
hash_mod     = ["dep:sha2", "dep:sha3", "dep:blake3", "dep:hmac"]
random_mod   = ["dep:rand", "dep:rand_chacha"]
datetime_mod = ["dep:chrono"]
url_mod      = ["dep:url"]
dirs_mod     = ["dep:dirs"]

# Phase 2 — formats & compression
compress_mod = ["dep:flate2", "dep:zstd"]
archive_mod  = ["dep:tar", "dep:zip"]
yaml_mod     = ["dep:serde_yaml"]
xml_mod      = ["dep:quick-xml"]

# Phase 3 — advanced networking
http_full_mod = ["dep:ureq", "dep:base64"]
dns_mod       = ["dep:hickory-resolver", "dep:tokio", "dep:once_cell"]
email_mod     = ["dep:lettre", "dep:tokio", "dep:once_cell"]

[dependencies]
titan_tls = { path = "../titan_tls" }
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
sha1 = "0.10"
getrandom = "0.3"

# Phase 1 — optional, activated via features
regex        = { version = "1", optional = true, default-features = false, features = ["std", "perf", "unicode"] }
uuid         = { version = "1", optional = true, default-features = false, features = ["std", "v4", "v7"] }
sha2         = { version = "0.10", optional = true }
sha3         = { version = "0.10", optional = true }
blake3       = { version = "1", optional = true, default-features = false, features = ["std"] }
hmac         = { version = "0.12", optional = true }
rand         = { version = "0.9", optional = true, default-features = false, features = ["std", "std_rng", "os_rng", "thread_rng"] }
rand_chacha  = { version = "0.9", optional = true }
chrono       = { version = "0.4", optional = true, default-features = false, features = ["clock", "serde"] }
url          = { version = "2", optional = true }
dirs         = { version = "5", optional = true }

# Phase 2 — formats & compression
flate2       = { version = "1", optional = true }
zstd         = { version = "0.13", optional = true, default-features = false }
tar          = { version = "0.4", optional = true }
zip          = { version = "2", optional = true, default-features = false, features = ["deflate"] }
serde_yaml   = { version = "0.9", optional = true }
quick-xml    = { version = "0.36", optional = true, features = ["serialize"] }

# Phase 3 — advanced networking (all pure-Rust, TLS via rustls, Termux friendly)
ureq              = { version = "2", optional = true, default-features = false, features = ["tls", "json", "gzip"] }
hickory-resolver  = { version = "0.24", optional = true, default-features = false, features = ["system-config", "tokio-runtime"] }
lettre            = { version = "0.11", optional = true, default-features = false, features = ["smtp-transport", "rustls-tls", "webpki-roots", "builder"] }
base64            = { version = "0.22", optional = true }
tokio             = { version = "1", optional = true, features = ["rt", "net"] }
once_cell         = { version = "1", optional = true }
