[package]
name = "titan_cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["extras"]
# Toggle the Phase-1 optional stdlib modules from a single place. `extras` on
# means `zett` ships with regex, uuid, hash, random, datetime, url and dirs
# available to .titan programs; disable it (`cargo install --no-default-features`)
# for a stripped-down build.
extras = ["titan_vm/extras"]

[dependencies]
titan_lexer = { path = "../titan_lexer" }
titan_parser = { path = "../titan_parser" }
titan_ast = { path = "../titan_ast" }
titan_typechecker = { path = "../titan_typechecker" }
titan_codegen = { path = "../titan_codegen" }
titan_vm = { path = "../titan_vm", default-features = false }
titan_pkg = { path = "../titan_pkg" }
titan_wasm = { path = "../titan_wasm" }
serde_json.workspace = true
clap.workspace = true
thiserror.workspace = true

[[bin]]
name = "titan"
path = "src/main.rs"
