[package]
name = "titan_vm"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["extras"]
# Forward feature flags through to the stdlib so builders can enable /
# disable the optional modules from any consumer crate.
extras = [
    "titan_stdlib/extras",
    "regex_mod", "uuid_mod", "hash_mod", "random_mod", "datetime_mod", "url_mod", "dirs_mod",
    "compress_mod", "archive_mod", "yaml_mod", "xml_mod",
    "http_full_mod", "dns_mod", "email_mod",
    "crypto_mod", "password_mod", "jwt_mod",
    "termux_mod",
    "term_mod", "readline_mod", "progress_mod",
    "image_mod", "qrcode_mod",
    "procfs_mod", "fswatch_mod", "signals_mod",
    "audio_mod",
    "kv_mod", "redis_mod",
    "server_mod", "router_mod",
    "plot_mod",
    "tokenize_mod",
]
regex_mod     = ["titan_stdlib/regex_mod"]
uuid_mod      = ["titan_stdlib/uuid_mod"]
hash_mod      = ["titan_stdlib/hash_mod"]
random_mod    = ["titan_stdlib/random_mod"]
datetime_mod  = ["titan_stdlib/datetime_mod"]
url_mod       = ["titan_stdlib/url_mod"]
dirs_mod      = ["titan_stdlib/dirs_mod"]
compress_mod  = ["titan_stdlib/compress_mod"]
archive_mod   = ["titan_stdlib/archive_mod"]
yaml_mod      = ["titan_stdlib/yaml_mod"]
xml_mod       = ["titan_stdlib/xml_mod"]
http_full_mod = ["titan_stdlib/http_full_mod"]
dns_mod       = ["titan_stdlib/dns_mod"]
email_mod     = ["titan_stdlib/email_mod"]
crypto_mod    = ["titan_stdlib/crypto_mod"]
password_mod  = ["titan_stdlib/password_mod"]
jwt_mod       = ["titan_stdlib/jwt_mod"]
termux_mod    = ["titan_stdlib/termux_mod"]
term_mod      = ["titan_stdlib/term_mod"]
readline_mod  = ["titan_stdlib/readline_mod"]
progress_mod  = ["titan_stdlib/progress_mod"]
image_mod     = ["titan_stdlib/image_mod"]
qrcode_mod    = ["titan_stdlib/qrcode_mod"]
procfs_mod    = ["titan_stdlib/procfs_mod"]
fswatch_mod   = ["titan_stdlib/fswatch_mod"]
signals_mod   = ["titan_stdlib/signals_mod"]
audio_mod     = ["titan_stdlib/audio_mod"]
kv_mod        = ["titan_stdlib/kv_mod"]
redis_mod     = ["titan_stdlib/redis_mod"]
server_mod    = ["titan_stdlib/server_mod"]
router_mod    = ["titan_stdlib/router_mod"]
plot_mod      = ["titan_stdlib/plot_mod"]
tokenize_mod  = ["titan_stdlib/tokenize_mod"]

[dependencies]
titan_codegen = { path = "../titan_codegen" }
titan_stdlib = { path = "../titan_stdlib", default-features = false }
titan_tls = { path = "../titan_tls" }
titan_sqlite = { path = "../titan_sqlite" }
titan_postgres = { path = "../titan_postgres" }
titan_mysql = { path = "../titan_mysql" }
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
titan_lexer = { path = "../titan_lexer" }
titan_parser = { path = "../titan_parser" }