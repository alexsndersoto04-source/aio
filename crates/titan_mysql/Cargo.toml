[package]
name = "titan_mysql"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# IMPORTANT: use `rustls-tls-ring`, not `rustls-tls`. The default `rustls-tls`
# activates rustls's `aws_lc_rs` feature, which pulls in aws-lc-sys (~300 C
# files, several GB of intermediate .o) and blows up small Termux storage.
mysql = { version = "26", default-features = false, features = ["minimal-rust", "rustls-tls-ring"] }
thiserror.workspace = true
