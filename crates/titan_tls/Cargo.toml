[package]
name = "titan_tls"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# TLS defaults are declared at the workspace root to force `ring` (not
# aws-lc-sys) across every crate; see Cargo.toml at the repo root.
rustls.workspace = true
webpki-roots.workspace = true
rustls-pemfile = "2"
thiserror.workspace = true

[dev-dependencies]
# rcgen defaults already use ring; keep it explicit.
rcgen = { version = "0.13", default-features = false, features = ["pem", "ring"] }
