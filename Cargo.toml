[workspace]
members = [
    "crates/titan_lexer",
    "crates/titan_ast",
    "crates/titan_parser",
    "crates/titan_typechecker",
    "crates/titan_hir",
    "crates/titan_mir",
    "crates/titan_codegen",
    "crates/titan_vm",
    "crates/titan_gc",
    "crates/titan_macros",
    "crates/titan_runtime",
    "crates/titan_stdlib",
    "crates/titan_cli",
    "crates/titan_lsp",
    "crates/titan_pkg",
    "crates/titan_dap",
    "crates/titan_tls",
    "crates/titan_sqlite",
    "crates/titan_postgres",
    "crates/titan_mysql",
    "crates/titan_wasm",
]
resolver = "2"

[workspace.package]
version = "0.11.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
toml = "0.8"
semver = "1"

# --- Termux-friendly TLS: force the whole workspace onto the `ring` backend
# and off aws-lc-sys, which pulls in ~300 C files that fill small Termux
# partitions when compiling. Every direct dep on rustls / rustls-webpki /
# tokio-rustls in the workspace inherits these settings via
# `.workspace = true`, and Cargo feature unification propagates them to the
# rest of the graph too.
rustls        = { version = "0.23", default-features = false, features = ["std", "ring", "tls12", "logging"] }
rustls-webpki = { version = "0.103", default-features = false, features = ["std", "ring"] }
tokio-rustls  = { version = "0.26", default-features = false, features = ["logging", "tls12", "ring"] }
webpki-roots  = "1"
