name: Termux ARM 32-bit

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: termux-arm-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  TERMUX_TARGET: armv7-linux-androideabi
  TERMUX_ARCH: arm
  ANDROID_API: "24"
  NDK_VERSION: 27.2.12479018

jobs:
  host-quality:
    name: Host tests and static checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: termux-host-quality

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Run workspace tests
        run: cargo test --locked --workspace --all-targets --no-fail-fast

      - name: Verify native registry
        run: python3 verify_phase34.py

  build-termux-arm:
    name: Build and package native Termux ARM binary
    needs: host-quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Rust stable and ARMv7 Android target
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          targets: armv7-linux-androideabi

      - name: Install Android command-line tools
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407

      - name: Install pinned Android NDK
        run: sdkmanager "ndk;${NDK_VERSION}"

      - name: Configure Android ARMv7 toolchain
        shell: bash
        run: |
          set -euo pipefail
          toolchain="${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64"
          clang="${toolchain}/bin/armv7a-linux-androideabi${ANDROID_API}-clang"
          clangxx="${toolchain}/bin/armv7a-linux-androideabi${ANDROID_API}-clang++"
          test -x "$clang"
          test -x "$clangxx"
          test -x "${toolchain}/bin/llvm-ar"
          {
            echo "CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER=$clang"
            echo "CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_AR=${toolchain}/bin/llvm-ar"
            echo "CC_armv7_linux_androideabi=$clang"
            echo "CXX_armv7_linux_androideabi=$clangxx"
            echo "AR_armv7_linux_androideabi=${toolchain}/bin/llvm-ar"
            echo "RANLIB_armv7_linux_androideabi=${toolchain}/bin/llvm-ranlib"
          } >> "$GITHUB_ENV"

      - name: Cache Rust ARM build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: termux-armv7-android

      - name: Build complete release binary
        run: cargo build --locked --release -p titan_cli --target "$TERMUX_TARGET"

      - name: Verify ARM ELF and package Termux release candidate
        shell: bash
        run: |
          set -euo pipefail
          binary="target/${TERMUX_TARGET}/release/titan"
          test -s "$binary"

          mkdir -p dist/elf
          file "$binary" | tee dist/elf/file.txt
          readelf -h "$binary" | tee dist/elf/header.txt
          readelf -l "$binary" | tee dist/elf/program-headers.txt
          grep -Eq 'Class:[[:space:]]+ELF32' dist/elf/header.txt
          grep -Eq 'Machine:[[:space:]]+ARM' dist/elf/header.txt

          workspace_version="$(awk '
            /^\[workspace\.package\]$/ { active=1; next }
            /^\[/ { active=0 }
            active && /^version[[:space:]]*=/ {
              value=$0; sub(/^[^=]*=[[:space:]]*/, "", value)
              gsub(/^[\"[:space:]]+|[\"[:space:]]+$/, "", value)
              print value; exit
            }
          ' Cargo.toml)"
          package_version="${workspace_version}~ci${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"

          cp "$binary" dist/zett
          chmod 0755 dist/zett
          cp scripts/test-termux-release.sh dist/
          chmod 0755 dist/test-termux-release.sh
          bash make-zett-package.sh \
            --binary "$binary" \
            --arch "$TERMUX_ARCH" \
            --version "$package_version" \
            --output-dir dist

          package="dist/zett_${package_version}_${TERMUX_ARCH}.deb"
          test -s "$package"
          test "$(dpkg-deb --field "$package" Architecture)" = "$TERMUX_ARCH"
          test "$(dpkg-deb --field "$package" Version)" = "$package_version"
          dpkg-deb --info "$package" | tee dist/package-info.txt
          dpkg-deb --contents "$package" | tee dist/package-contents.txt

          mkdir -p dist/extracted
          dpkg-deb --extract "$package" dist/extracted
          packaged_binary="dist/extracted/data/data/com.termux/files/usr/bin/zett"
          test -x "$packaged_binary"
          cmp "$binary" "$packaged_binary"

          sha256sum "$package" dist/zett > dist/SHA256SUMS
          rm -rf dist/extracted

      - name: Upload native Termux package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: zett-termux-arm-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
