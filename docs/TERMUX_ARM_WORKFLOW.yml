name: Termux ARM 32-bit

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: termux-arm-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  TERMUX_TARGET: armv7-linux-androideabi
  TERMUX_ARCH: arm
  ANDROID_API: "24"
  NDK_VERSION: 27.2.12479018

jobs:
  build-termux-arm:
    name: Build and package native Termux ARM binary
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Rust stable and ARMv7 Android target
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          targets: armv7-linux-androideabi

      - name: Install Android command-line tools
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407

      - name: Cache Rust ARM build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: termux-armv7-android

      - name: Build, verify, and package Termux release candidate
        run: bash scripts/build-termux-ci.sh

      - name: Upload native Termux package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: zett-termux-arm-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
