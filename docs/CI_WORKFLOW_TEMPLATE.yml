name: CI

on:
  push:
    branches: [ main, "arena/**" ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: cargo test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check
        continue-on-error: true   # formatting is advisory for now

      - name: cargo check (default features)
        run: cargo check --workspace --all-targets

      - name: cargo test (default features)
        run: cargo test --workspace --all-targets --no-fail-fast

      - name: cargo check (no default features)
        run: cargo check --workspace --all-targets --no-default-features

  aarch64-cross:
    name: cross-check AArch64 Android with NDK
    runs-on: ubuntu-latest
    env:
      ANDROID_API: "24"
      NDK_VERSION: 27.2.12479018
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Android command-line tools
        uses: android-actions/setup-android@v3

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check complete workspace for aarch64-linux-android with NDK
        run: bash scripts/check-android-aarch64-ci.sh
