# Verificación con un navegador de verdad (revision: 9)
# ============================================================
# Compila la web, la sirve junto a la API y la abre con dos navegadores que se
# llaman entre ellos (micrófono y cámara simulados). Sirve para comprobar las
# llamadas de voz y video y para dejar capturas, sin tocar el sitio en vivo.
#
# Se dispara al tocar estos archivos. No deja nada visible: usa dos cuentas de
# prueba ocultas y borra sus llamadas al terminar. La prueba parte siempre de un
# hilo limpio, espera a que los dos navegadores estén enganchados y, si un aviso
# no llega, recarga las pantallas y lo repite (hasta 3 intentos).
name: Ver la web con un navegador

on:
  push:
    branches: ["arena/01a0b287-aio"]
    paths:
      - ".github/scripts/diag/**"
      - ".github/workflows/ver-web.yml"
      # Si se toca el código de las llamadas, se comprueba solo.
      - "frontend/src/llamada.jsx"
      - "frontend/src/llamada.css"
      - "frontend/src/realtime.js"
      - "frontend/src/views/MessagesView.jsx"
      - "projects/moon/server/src/ws.mjs"
      - "projects/moon/server/src/rutas-mensajes.mjs"

permissions:
  contents: write

concurrency:
  group: ver-web
  cancel-in-progress: false

jobs:
  ver:
    name: Mirar la web con un navegador
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Compilar la web
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Instalar el navegador y sus herramientas
        working-directory: frontend
        run: |
          npm install --no-save playwright@1.47.2
          npx --yes playwright@1.47.2 install --with-deps chromium
          python3 -m pip install --quiet --disable-pip-version-check pillow || echo "(sin pillow)"

      - name: Despertar la API y preparar las dos cuentas de prueba
        env:
          API: https://moon-dal0.onrender.com
        run: |
          echo "esperando a la API…"
          listo=no
          for i in $(seq 1 45); do
            codigo=$(curl -s --max-time 30 -o /tmp/salud.json -w '%{http_code}' "$API/api/health" || true)
            echo "intento $i: codigo $codigo $(head -c 120 /tmp/salud.json 2>/dev/null)"
            if grep -q '"status":"ok"' /tmp/salud.json 2>/dev/null; then listo=si; break; fi
            sleep 6
          done
          echo "API lista: $listo"
          if [ "$listo" != "si" ]; then
            echo "la API no despertó a tiempo" | tee /tmp/preparar.log
            exit 1
          fi
          if ! python3 "$GITHUB_WORKSPACE/.github/scripts/diag/preparar-llamadas.py" "$API" /tmp/sesiones.json > /tmp/preparar.log 2>&1; then
            echo "falló la preparación de las cuentas:"
            cat /tmp/preparar.log
            exit 1
          fi
          cat /tmp/preparar.log
          python3 "$GITHUB_WORKSPACE/.github/scripts/diag/anadir-api.py" /tmp/sesiones.json "$API" >> /tmp/preparar.log 2>&1

      - name: Esperar a que la API tenga el código nuevo
        env:
          API: https://moon-dal0.onrender.com
          GH_TOKEN: ${{ github.token }}
        run: |
          corto=$(echo "$GITHUB_SHA" | cut -c1-7)
          echo "debe correr el commit: $corto"
          archivos=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA" \
            | grep -o '"filename": *"[^"]*"' | cut -d'"' -f4)
          if ! echo "$archivos" | grep -q '^projects/moon/server/'; then
            echo "este push no toca el servidor: no hay que esperar"
            exit 0
          fi
          visto=""
          for i in $(seq 1 60); do
            visto=$(curl -s --max-time 20 "$API/api/health" | sed -n 's/.*"commit":"\([^"]*\)".*/\1/p')
            echo "intento $i: la API dice «${visto}»"
            if [ "$visto" = "$corto" ]; then break; fi
            sleep 8
          done
          echo "la API quedó en: ${visto:-sin dato}"

      - name: Servir la web compilada (y la API por el mismo puente)
        run: |
          set -x
          node "$GITHUB_WORKSPACE/.github/scripts/diag/servidor.cjs" "$GITHUB_WORKSPACE/frontend/dist" 4173 > /tmp/servidor.log 2>&1 &
          sleep 2
          cat /tmp/servidor.log
          curl -s -o /dev/null -w 'web: %{http_code}\n' http://127.0.0.1:4173/
          curl -s -o /dev/null -w 'api por el puente: %{http_code}\n' http://127.0.0.1:4173/api/health

      - name: Llamadas de voz y video entre dos navegadores
        working-directory: frontend
        run: |
          mkdir -p /tmp/fotos
          node "$GITHUB_WORKSPACE/.github/scripts/diag/llamada.mjs" \
            "http://127.0.0.1:4173" /tmp/sesiones.json /tmp/fotos /tmp/llamada.json \
            > /tmp/salida-llamada.txt 2>&1 || true
          cat /tmp/salida-llamada.txt | tail -40
          ls -la /tmp/fotos || true

      - name: Publicar el resultado en el commit
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 "$GITHUB_WORKSPACE/.github/scripts/diag/publicar-llamadas.py" "$GITHUB_SHA" /tmp/llamada.json /tmp/fotos

      - name: Guardar los registros y las capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verificacion-llamadas
          path: |
            /tmp/llamada.json
            /tmp/fotos/*.png
            /tmp/servidor.log
            /tmp/salida-llamada.txt
            /tmp/sesiones.json
          if-no-files-found: warn
