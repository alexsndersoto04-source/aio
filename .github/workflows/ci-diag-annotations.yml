# ============================================================================
# Diagnóstico de CI vía anotaciones
#
# Los logs de los jobs viven en results-receiver.actions.githubusercontent.com,
# un host NO alcanzable desde los entornos Arena. Pero las ANOTACIONES de los
# jobs (mensajes ::error::/::warning::) SÍ son legibles por la API
# (GET /actions/runs/{id}/jobs y /check-runs/{id}/annotations).
#
# Este workflow corrobora `cargo test --workspace --all-targets` y emite las
# líneas de fallo como anotaciones, para poder leerlas desde Arena.
#
# Se dispara (y dispara NADA más) cuando cambia el marcador CI_DIAG.txt:
#   echo "diagnóstico $(date)" > CI_DIAG.txt && git add CI_DIAG.txt && git commit
# Borra el marcador (o deja de modificarlo) cuando no lo necesites.
# ============================================================================

name: CI diagnostics (annotations)

on:
  push:
    branches: [main, "arena/**"]
    paths:
      - "CI_DIAG.txt"

permissions:
  contents: read

concurrency:
  group: ci-diag-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-test-annotations:
    name: cargo test → anotaciones
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      # Fase 42A: el workspace con extras enlaza ALSA (cpal).
      - name: System deps for native audio (cpal/ALSA)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo test (capturado, nunca falla el paso)
        run: |
          # || true: el runner ejecuta con errexit; sin esto el paso morirá
          # antes de que el paso de anotaciones pueda leer /tmp/ctest.txt.
          cargo test --workspace --all-targets --no-fail-fast > /tmp/ctest.txt 2>&1 || true
          echo "cargo test terminado; salida completa en /tmp/ctest.txt"

      - name: examples .titan (capturado, nunca falla el paso)
        run: |
          # Fase 42A: verifica los ejemplos de audio de verdad (check + run
          # headless). El binario ya quedó compilado por el paso anterior.
          cargo build -q -p titan_cli > /tmp/cbuild.txt 2>&1 || true
          BIN=target/debug/titan
          {
            $BIN check examples/reproductor_hifi.titan 2>&1
            echo "check_hifi_exit=$?"
            $BIN run examples/reproductor_hifi.titan 2>&1
            echo "run_hifi_exit=$?"
            $BIN check examples/reproductor_musica.titan 2>&1
            echo "check_musica_exit=$?"
            $BIN run examples/reproductor_musica.titan 2>&1
            echo "run_musica_exit=$?"
            $BIN check examples/reproductor_nube.titan 2>&1
            echo "check_nube_exit=$?"
            $BIN run examples/reproductor_nube.titan 2>&1
            echo "run_nube_exit=$?"
          } > /tmp/examples.txt 2>&1 || true
          echo "ejemplos terminados; salida en /tmp/examples.txt"

      - name: Emitir líneas de fallo como anotaciones
        if: always()
        run: |
          # El API de anotaciones solo conserva ~12 por job (2 automáticas +
          # ~10 de contenido): se emite SOLO el resumen del fallo.
          # Fase 42A: pelar ANSI primero (cargo coloriza error/warning).
          sed -i 's/\x1b\[[0-9;]*m//g' /tmp/ctest.txt
          {
            grep -E "^error(\[|:)" /tmp/ctest.txt | head -4
            grep -E "^ +-->" /tmp/ctest.txt | head -4
            grep -E "^warning: (unused|.*never (read|used|constructed))" /tmp/ctest.txt | head -2
            grep -E "test result: FAILED" /tmp/ctest.txt | head -2
            grep -A8 "^failures:$" /tmp/ctest.txt | grep -E "^\s+\S" | head -6
            grep -E "panicked at" /tmp/ctest.txt | head -2
            echo "--- examples ---"
            grep -E "_exit=" /tmp/examples.txt | head -4
            grep -iE "error|panic|traceback|exception" /tmp/examples.txt | head -4
            tail -2 /tmp/examples.txt
          } | head -12 | while IFS= read -r line; do
            echo "::error file=CI_DIAG.txt::${line:0:300}"
          done
