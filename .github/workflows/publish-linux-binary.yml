name: Publish Linux x86_64 binary

# Builds the zett binary for x86_64 Linux (compatible with Debian 12 / glibc >= 2.35,
# i.e. with the Arena sandbox) and publishes it to the `binaries` branch so it can
# be fetched from any machine with repo access:
#
#   git fetch origin binaries
#   git show binaries:zett-linux-x86_64 > zett && chmod +x zett
#
# The branch contains: zett-linux-x86_64 (executable), .sha256, VERSION, COMMIT.

on:
  workflow_dispatch:
  push:
    branches: [main, 'arena/**']
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/publish-linux-binary.yml'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies (libasound2)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-linux-x64-${{ hashFiles('Cargo.lock') }}

      - name: Build release
        run: cargo build --release --bin zett

      - name: Publish to the binaries branch
        id: publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          #!/bin/bash
          set -u

          fail() {
            # Visible in the check-run annotations (readable via API without log download).
            echo "::error::[publish] $1"
            exit 1
          }

          sha256sum target/release/zett > target/release/zett.sha256 || fail "sha256sum failed"
          echo "Binary: $(du -h target/release/zett | cut -f1)"

          {
            echo "release"
            echo "v1.1.0-alpha"
            date -u +"%Y-%m-%dT%H:%M:%SZ"
          } > target/release/VERSION

          git rev-parse HEAD > target/release/COMMIT

          WORK=$(mktemp -d)
          trap 'rm -rf "$WORK"' EXIT
          git clone --quiet https://x-access-token:$GITHUB_TOKEN@github.com/alexsndersoto04-source/aio.git "$WORK" || fail "git clone failed (token rejected?)"
          cd "$WORK"
          git config user.name "publish-bot"
          git config user.email "publish-bot@users.noreply.github.com"

          # Sparse checkout: only the files we will commit.
          git checkout --quiet main
          git sparse-checkout init --cone
          git sparse-checkout set zett-linux-x86_64 zett-linux-x86_64.sha256 VERSION COMMIT
          echo "=== branch main contents ==="
          git ls-files
          echo "=== sha256 of the freshly built binary ==="
          sha256sum "$GITHUB_WORKSPACE/target/release/zett"
          echo "=== previous sha256 in the branch (if any) ==="
          sha256sum zett-linux-x86_64.sha256 2>/dev/null || echo "(no previous version)"
          echo "=== previous VERSION in the branch (if any) ==="
          cat VERSION 2>/dev/null || echo "(no previous version)"

          cp "$GITHUB_WORKSPACE/target/release/zett" ./zett-linux-x86_64
          cp "$GITHUB_WORKSPACE/target/release/zett.sha256" ./zett-linux-x86_64.sha256
          cp "$GITHUB_WORKSPACE/target/release/VERSION" ./VERSION
          cp "$GITHUB_WORKSPACE/target/release/COMMIT" ./COMMIT

          git add zett-linux-x86_64 zett-linux-x86_64.sha256 VERSION COMMIT
          git commit --quiet -m "Publish zett-linux-x86_64 (commit $(cat COMMIT), $(date -u +%Y-%m-%d))" || fail "git commit failed (nothing to commit?)"

          git push --force "https://x-access-token:$GITHUB_TOKEN@github.com/alexsndersoto04-source/aio.git" "HEAD:refs/heads/binaries" \
            > /tmp/push.log 2>&1 || fail "git push to refs/heads/binaries failed — token probably lacks write permission"
          echo "--- git push output ---"
          cat /tmp/push.log
          echo "::notice::[publish] Branch 'binaries' actualizada correctamente"

      - name: Upload binary as artifact (descargable desde la UI de GitHub)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zett-linux-x86_64-${{ github.run_id }}
          path: |
            target/release/zett
            target/release/zett.sha256
            target/release/VERSION
            target/release/COMMIT
          retention-days: 30
