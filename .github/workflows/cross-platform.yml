# Phase 35 — Verificacion y builds multi-OS en MAQUINAS REALES.
#
# Regla del proyecto: nada se declara "funciona en X" hasta que un test
# corre verde en una maquina X de verdad. Este workflow es esa regla
# ejecutandose sola:
#
#   1. job `test`  -> cargo test del workspace entero corriendo en runners
#      reales de Ubuntu, Windows y macOS. Si algo falla en algun OS,
#      la matriz lo dice en rojo y NO se construye ningun binario.
#   2. job `build` -> solo si los tests pasan, compila el binario `zett`
#      (crate titan_cli) en cada OS, lo empaqueta y:
#        - sube "artifacts" en TODA corrida (descargables de prueba)
#        - adjunta los binarios al GitHub Release cuando el trigger es un tag v*
#
# Android/Termux ARM sigue su flujo probado: compilacion on-device +
# make-zett-package.sh + la tienda APT en la rama zett-repo.

name: cross-platform

on:
  push:
    # TEMPORAL: `arena/01a0d172-aio` esta aca solo para verificar este cambio
    # desde la rama de trabajo (workflow_dispatch ejecuta la version de `main`,
    # no la de la rama, asi que no sirve para probar un job nuevo). Se quita en
    # cuanto el run de verificacion este verde.
    branches: [main, "arena/01a0d172-aio"]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test --workspace --all-targets
        run: cargo test --workspace --all-targets

  build:
    name: build (${{ matrix.asset }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu,  asset: linux-x86_64 }
          - { os: ubuntu-latest,  target: aarch64-unknown-linux-gnu, asset: linux-aarch64 }
          - { os: ubuntu-latest,  target: armv7-unknown-linux-gnueabihf, asset: linux-armv7hf }
          - { os: macos-latest,   target: aarch64-apple-darwin,      asset: macos-arm64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,    asset: windows-x86_64 }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Linker cruzado aarch64 (solo el target linux-aarch64)
        if: matrix.asset == 'linux-aarch64'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
      - name: Linker cruzado armv7 (solo el target linux-armv7hf)
        if: matrix.asset == 'linux-armv7hf'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf
          echo "CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER=arm-linux-gnueabihf-gcc" >> "$GITHUB_ENV"
      - name: cargo build --release (titan_cli)
        run: cargo build --release -p titan_cli --target ${{ matrix.target }}

      - name: Empaquetar (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist/stage
          cp "target/${{ matrix.target }}/release/titan" dist/stage/zett
          cp README.md LICENSE dist/stage/
          tar -czf "dist/zett-${{ matrix.asset }}.tar.gz" -C dist/stage .

      - name: Empaquetar (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/stage | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/titan.exe" "dist/stage/zett.exe"
          Copy-Item README.md, LICENSE dist/stage/
          Compress-Archive -Path "dist/stage/*" -DestinationPath "dist/zett-${{ matrix.asset }}.zip" -Force

      - name: Artifact descargable (toda corrida)
        uses: actions/upload-artifact@v4
        with:
          name: zett-${{ matrix.asset }}
          path: dist/zett-*

      - name: Adjuntar al Release (solo tags v*)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/zett-*

  # Entrada EXTRA de la matriz: el MISMO `zett` compilado contra glibc vieja.
  #
  # Los 3 assets linux de arriba se compilan en `ubuntu-latest`, que trae una
  # glibc reciente. El binario resultante queda atado a esa glibc: pide
  # simbolos versionados que una distro mas vieja no tiene, y entonces ni
  # arranca (`./zett: version `GLIBC_2.xx' not found`). La compatibilidad de
  # glibc va de viejo -> nuevo, nunca al reves, asi que la receta es compilar
  # contra la glibc mas vieja que se quiera soportar.
  #
  # Este job compila dentro de ubuntu:22.04 (glibc 2.35): el binario corre en
  # cualquier glibc >= 2.35 (Debian 12, Ubuntu 22.04+, RHEL 9, ...), que es lo
  # que el asset `linux-x86_64` normal no garantiza.
  #
  # Va en un job aparte en vez de una fila mas de la matriz de `build` porque
  # `container:` no se puede aplicar por entrada de matriz: un job con
  # `container:` se lo impone a todas sus filas.
  build-portable:
    name: build (linux-x86_64-glibc235)
    needs: test
    runs-on: ubuntu-latest
    container:
      image: ubuntu:22.04
    env:
      ASSET: linux-x86_64-glibc235
    defaults:
      run:
        shell: bash
    steps:
      - name: Dependencias del sistema
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            ca-certificates curl git binutils \
            build-essential pkg-config \
            libx11-dev libxcb1-dev libxkbcommon-dev libasound2-dev \
            libudev-dev libssl-dev
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/checkout@v4

      - name: Rust estable
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup.sh
          sh /tmp/rustup.sh -y --profile minimal --default-toolchain stable
          # `. cargo/env` es para ESTE paso; `$GITHUB_PATH` recien rige en los
          # pasos siguientes. Faltaba el source y `rustc -V` moria con 127.
          . "$HOME/.cargo/env"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustc -V
          cargo -V

      - uses: Swatinem/rust-cache@v2
        continue-on-error: true
        with:
          save-if: "always"

      - name: cargo build --release (titan_cli)
        run: cargo build --release -p titan_cli

      # La prueba de que el asset es lo que promete: se imprime la glibc maxima
      # que exige el binario y se lo ejecuta ahi mismo, en glibc 2.35.
      # (Sin tuberias a `head`: `shell: bash` implica `bash -eo pipefail` y un
      # SIGPIPE ahi mata el paso con codigo 141.)
      - name: Verificar glibc maxima y que el binario corre
        run: |
          bin=target/release/titan
          ldd --version > /tmp/ldd.txt 2>&1
          sed -n '1p' /tmp/ldd.txt
          objdump -T "$bin" > /tmp/dyn.txt
          echo "glibc maxima exigida por el binario:"
          grep -o 'GLIBC_[0-9]*\.[0-9]*' /tmp/dyn.txt | sort -uV | tail -1 || echo "(sin refs GLIBC)"
          "$bin" version

      # Empaquetado identico al de los otros assets linux (mismo contenido,
      # mismo formato); lo unico que cambia es la glibc contra la que enlaza.
      - name: Empaquetar
        run: |
          mkdir -p dist/stage
          cp target/release/titan dist/stage/zett
          cp README.md LICENSE dist/stage/
          tar -czf "dist/zett-${ASSET}.tar.gz" -C dist/stage .
          ls -l dist/

      - name: Artifact descargable (toda corrida)
        uses: actions/upload-artifact@v4
        with:
          # Nombre escrito a proposito (y no `zett-${{ env.ASET }}`) para no
          # depender del contexto `env` dentro de `with:`. Si cambia el env
          # ASSET de arriba, cambiar este nombre tambien.
          name: zett-linux-x86_64-glibc235
          path: dist/zett-*

      - name: Adjuntar al Release (solo tags v*)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/zett-*
