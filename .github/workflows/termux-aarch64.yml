# ============================================================================
# Termux AArch64 (64-bit) CI
#
# Compila el binario zett para aarch64-linux-android con el clang del NDK
# como linker, verifica estructuralmente el ELF (file/readelf) y empaqueta
# un .deb instalable en Termux (dpkg -i zett_*.deb). El artifact
# `zett-termux-aarch64-<run>` contiene el .deb, el binario crudo,
# SHA256SUMS, VERSION y COMMIT.
#
# Nota: el setup del SDK Android NO usa android-actions/setup-android —
# esa action está rota desde 2026-09-14 (Google retiró el paquete legacy
# "tools" del repositorio del SDK). Ver scripts/setup-android-ci.sh.
# ============================================================================

name: Termux AArch64 (64-bit)

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: termux-aarch64-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  TERMUX_ARCH: aarch64
  ANDROID_API: "24"
  NDK_VERSION: 27.2.12479018

jobs:
  build-termux-aarch64:
    name: Build and package native Termux AArch64 binary
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust stable and AArch64 Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-linux-android

      - name: Install Android command-line tools
        run: bash scripts/setup-android-ci.sh

      - name: Cache Rust AArch64 build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: termux-aarch64-android

      - name: Build, verify, and package Termux AArch64 release candidate
        run: bash scripts/build-termux-ci.sh

      - name: Upload native Termux AArch64 package
        uses: actions/upload-artifact@v4
        with:
          name: zett-termux-aarch64-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
