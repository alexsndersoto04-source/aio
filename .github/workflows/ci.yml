name: CI

on:
  push:
    branches: [ main, "arena/**" ]
  pull_request:
    branches: [ main ]

# Titan se construye sin Rust: la semilla (selfhost/semilla/) compila el compilador, éste se compila a sí mismo
# dos veces más y las tres generaciones tienen que ser idénticas (punto fijo). Ver selfhost/semilla/LEEME.md.
jobs:
  bootstrap:
    name: punto fijo + comprobaciones
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap (semilla -> titanc1 == titanc2 == titanc3 -> titan)
        run: bash selfhost/bootstrap.sh

      - name: "Cobertura de la biblioteca estándar (funciones std con cuerpo en Titan)"
        # Sin `| tail -3`: el pipe hacía que el código de salida del paso fuera el de `tail`
        # (siempre 0), así que el paso salía en verde aunque cobertura.sh terminara con código 3
        # (pasaba siempre desde que se borró el `zett` de Rust que el guion exigía). Ahora se
        # guarda la salida completa y se exige cobertura COMPLETA de verdad: `set -euo pipefail`
        # y comparaciones explícitas, porque un `test` fallido sin `set -e` no detiene el guion.
        run: |
          set -euo pipefail
          bash selfhost/native/cobertura.sh -v > /tmp/cobertura.txt
          tail -3 /tmp/cobertura.txt
          total=$(sed -n 's|^TOTAL: [0-9]* / \([0-9]*\) nativas.*|\1|p' /tmp/cobertura.txt)
          hechas=$(sed -n 's|^TOTAL: \([0-9]*\) / [0-9]* nativas.*|\1|p' /tmp/cobertura.txt)
          if [ -z "$total" ] || [ -z "$hechas" ]; then
            echo "FALLO: cobertura.sh no imprimió la línea TOTAL (¿no llegó a contar?)" >&2
            exit 1
          fi
          if [ "$hechas" != "$total" ]; then
            echo "FALLO: cobertura incompleta: $hechas de $total nativas tienen cuerpo en Titan" >&2
            sed -n '/^--- faltan:/,$p' /tmp/cobertura.txt >&2
            exit 1
          fi
          echo "cobertura completa: $hechas / $total nativas con cuerpo en Titan"

      - name: check de Moon y de los ejemplos
        run: |
          selfhost/titan check projects/moon/src/main.titan
          selfhost/titan check examples/modules/main.titan
          selfhost/titan check examples/reproductor_hifi.titan

      - name: Un programa de verdad compilado y ejecutado
        run: |
          printf 'fn main() {\n    let n = 6 * 7\n    println("respuesta {n}")\n}\n' > /tmp/hola.titan
          test "$(selfhost/titan run /tmp/hola.titan)" = "respuesta 42"

      - name: "Lenguaje: interpolación de expresiones {expr}"
        run: selfhost/titan run selfhost/tests/lenguaje/interpolacion.titan

      - name: "Arreglos 2026-10-10: tipos de bucles, asignación en posición de sentencia y arquitectura"
        run: bash selfhost/tests/arreglos/probar.sh

      - name: "Errores 2026-10-10: posiciones reales, archivo correcto, sin duplicar"
        run: bash selfhost/tests/errores/probar.sh

      - name: "`titan test`: auxiliar omitido, imports desde src/ y tests/, fallo reportado"
        run: bash selfhost/tests/test_runner/probar.sh

      - name: "Diferencial del corpus: nativo vs la VM de bytecode del port (sin `zett`)"
        # Sin Rust: cada programa se compila a nativo y se compara con el mismo programa pasado por el
        # artefacto .tbc (`titan build` + `titan exec`). Incluye casos con argumentos, archivos de salida
        # y variables de entorno, que es lo que [args...] de `titan exec` habilita.
        run: |
          bash selfhost/native/verify_native.sh \
            selfhost/tests/native/basico.titan \
            selfhost/tests/native/error_division.titan \
            selfhost/tests/native/closures.titan \
            selfhost/tests/native/colecciones.titan \
            selfhost/tests/native/decimales.titan \
            selfhost/tests/native/texto_std.titan \
            selfhost/tests/native/vec_std.titan \
            selfhost/tests/native/hash_std.titan \
            selfhost/tests/native/json_std.titan \
            selfhost/tests/native/dirs_std.titan \
            selfhost/tests/native/archivos_bytes.titan \
            selfhost/tests/native/image_io.titan \
            selfhost/tests/native/kv_symlink_canonical.titan

      - name: "Registro de paquetes: publicar, servir por HTTPS y usar con fetch (servidor local)"
        run: bash selfhost/tests/pkg/registro/estatico.sh

      - name: "Registro público: leer de verdad desde GitHub (raw.githubusercontent.com)"
        run: |
          mkdir -p /tmp/app
          printf '[package]\nname = "app"\nversion = "0.1.0"\nedition = "2026"\n[dependencies.hola-zett]\nversion = "^0.1"\n' > /tmp/app/Titan.toml
          # la dirección apunta al commit exacto que se está probando
          selfhost/titan fetch --registry "https://raw.githubusercontent.com/${{ github.event.pull_request.head.repo.full_name || github.repository }}/${{ github.event.pull_request.head.sha || github.sha }}/registro" --project /tmp/app
          test -f /tmp/app/.titan/packages/hola-zett/0.1.0/src/lib.titan

      - name: Guardar el compilador como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: titan-linux-x86_64-${{ github.run_id }}
          path: |
            selfhost/titan
            selfhost/titanc3
          retention-days: 30
