name: CI

on:
  push:
    branches: [ main, "arena/**" ]
  pull_request:
    branches: [ main ]

# Titan se construye sin Rust: la semilla (selfhost/semilla/) compila el compilador, éste se compila a sí mismo
# dos veces más y las tres generaciones tienen que ser idénticas (punto fijo). Ver selfhost/semilla/LEEME.md.
jobs:
  bootstrap:
    name: punto fijo + comprobaciones
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap (semilla -> titanc1 == titanc2 == titanc3 -> titan)
        run: bash selfhost/bootstrap.sh

      - name: Cobertura de la biblioteca estándar (funciones std:: con cuerpo en Titan)
        run: bash selfhost/native/cobertura.sh -v | tail -3

      - name: check de Moon y de los ejemplos
        run: |
          selfhost/titan check projects/moon/src/main.titan
          selfhost/titan check examples/modules/main.titan
          selfhost/titan check examples/reproductor_hifi.titan

      - name: Un programa de verdad compilado y ejecutado
        run: |
          printf 'fn main() {\n    let n = 6 * 7\n    println("respuesta {n}")\n}\n' > /tmp/hola.titan
          test "$(selfhost/titan run /tmp/hola.titan)" = "respuesta 42"

      - name: Guardar el compilador como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: titan-linux-x86_64-${{ github.run_id }}
          path: |
            selfhost/titan
            selfhost/titanc3
          retention-days: 30
