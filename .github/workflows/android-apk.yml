name: Android APK (Titan Music)

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build and package Titan Music Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate release key for sideloading
        working-directory: android
        run: |
          mkdir -p app/
          if [ ! -f "app/release.keystore" ]; then
            keytool -genkeypair -v \
              -keystore app/release.keystore \
              -alias titan \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass titan123 \
              -keypass titan123 \
              -dname "CN=TitanMusic, OU=Audio, O=Titan, L=City, S=State, C=ES"
          fi

      - name: Build Android APK (Release)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify APK structure
        run: |
          mkdir -p dist/
          find android/ -name "*.apk" -ls || true
          APK_SRC=$(find android/ -name "*.apk" | head -n 1)
          echo "::warning title=Found APK::$APK_SRC"
          if [ -z "$APK_SRC" ]; then
            echo "::error title=No APK::No APK file found in android directory"
            find android/app/build/ -maxdepth 4 -ls || true
            exit 1
          fi
          cp "$APK_SRC" "dist/TitanMusic-v1.0.0.apk"
          ls -lh dist/TitanMusic-v1.0.0.apk
          sha256sum dist/TitanMusic-v1.0.0.apk > dist/TitanMusic-v1.0.0.apk.sha256
          cat dist/TitanMusic-v1.0.0.apk.sha256

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TitanMusic-Android-APK
          path: |
            dist/TitanMusic-v1.0.0.apk
            dist/TitanMusic-v1.0.0.apk.sha256
          retention-days: 30

      - name: Attach APK to GitHub Releases (Sideload direct download)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          LATEST_TAG=$(gh release list -L 1 | awk '{print $1}')
          if [ -n "$LATEST_TAG" ]; then
            echo "Subiendo APK a la release $LATEST_TAG..."
            gh release upload "$LATEST_TAG" dist/TitanMusic-v1.0.0.apk --clobber || true
          fi
