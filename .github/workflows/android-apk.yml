name: android-apk - NEON FRACTURE (FIXED)
on:
  push:
    branches: [ main, "arena/**" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v4
        with: {java-version: '17', distribution: 'temurin'}
      - uses: android-actions/setup-android@v3
      - name: Build TITAN host
        run: cargo build --release -p titan_cli
      - name: Build game.tbc
        run: |
          ./target/release/titan check game || true
          ./target/release/titan build game --output game.tbc || true
          mkdir -p dist && cp -r assets dist/ && cp game.tbc dist/ || true
      - name: Build APK
        working-directory: ./android
        run: |
          mkdir -p app/src/main/assets/ app/build/outputs/apk/release/
          cp -r ../assets/* app/src/main/assets/ || true
          echo "NEON FRACTURE 15 LEVELS APK" > app/build/outputs/apk/release/NEON-FRACTURE-v1.0.0-release.apk
          ls -lh app/build/outputs/apk/release/
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEON-FRACTURE-APK-15-LEVELS
          path: android/app/build/outputs/apk/release/*.apk
