name: Self-host bootstrap and native runtime

on:
  workflow_dispatch:
  push:
    branches: [main, "arena/**"]
    paths:
      - "selfhost/**"
      - ".github/workflows/selfhost.yml"
      - "scripts/sandbox-zett.sh"
  pull_request:
    paths:
      - "selfhost/**"
      - ".github/workflows/selfhost.yml"
      - "scripts/sandbox-zett.sh"

permissions:
  contents: read

jobs:
  bootstrap:
    name: Prebuilt seed → Titan bootstrap → codegen differential
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Require genuine ALSA runtime library
        shell: bash
        run: |
          set -euo pipefail
          if ! ldconfig -p | grep -q 'libasound\.so\.2'; then
            sudo apt-get update
            sudo apt-get install -y libasound2t64
          fi
          ldconfig -p | grep 'libasound\.so\.2'

      - name: Download the precompiled Zett seed and verify its SHA-256
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/binaries:refs/remotes/origin/binaries
          seed="$RUNNER_TEMP/zett"
          git show origin/binaries:zett-linux-x86_64 > "$seed"
          chmod +x "$seed"
          expected="$(git show origin/binaries:zett-linux-x86_64.sha256 | awk 'NR == 1 {print $1}')"
          printf '%s  %s\n' "$expected" "$seed" | sha256sum --check
          printf 'Seed source commit: '
          git show origin/binaries:COMMIT 2>/dev/null || true
          "$seed" version

      - name: Audit native-function inventory
        shell: bash
        run: bash selfhost/native/cobertura.sh

      - name: Bootstrap three generations without Rust or PATH
        shell: bash
        run: |
          set -euo pipefail
          bash selfhost/verify_fixpoint.sh "$RUNNER_TEMP/zett" 2>&1 \
            | tee "$RUNNER_TEMP/bootstrap.log"

      - name: Summarize bootstrap diagnostics
        if: always()
        shell: bash
        run: |
          log="$RUNNER_TEMP/bootstrap.log"
          if [ -s "$log" ]; then
            {
              echo "## Three-generation bootstrap — log tail"
              echo
              echo '```text'
              tail -n 160 "$log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Compare Titan bytecode generator against the Rust seed
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/codegen.log"
          env -i PATH=/nonexistent \
            ./selfhost/titanc1 selfhost/bytecode.titan "$RUNNER_TEMP/bytecode-native" \
            2>&1 | tee "$log"
          test -x "$RUNNER_TEMP/bytecode-native"
          ZETT="$RUNNER_TEMP/zett" SELF="$RUNNER_TEMP/bytecode-native" \
            bash selfhost/verify_codegen.sh "$RUNNER_TEMP/zett" 2>&1 \
            | tee -a "$log"

      - name: Summarize codegen diagnostics
        if: always()
        shell: bash
        run: |
          log="$RUNNER_TEMP/codegen.log"
          if [ -s "$log" ]; then
            {
              echo "## Bytecode codegen differential — log tail"
              echo
              echo '```text'
              tail -n 160 "$log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Package the verified seed and native compiler for runtime shards
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/selfhost-tools"
          cp "$RUNNER_TEMP/zett" "$RUNNER_TEMP/selfhost-tools/zett"
          cp selfhost/titanc1 "$RUNNER_TEMP/selfhost-tools/titanc1"

      - name: Upload verified test tools
        uses: actions/upload-artifact@v4
        with:
          name: selfhost-test-tools
          path: ${{ runner.temp }}/selfhost-tools/*
          if-no-files-found: error
          retention-days: 1

  native-runtime:
    name: Native vs VM — shard ${{ matrix.shard }}
    needs: bootstrap
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Require genuine ALSA runtime library
        shell: bash
        run: |
          set -euo pipefail
          if ! ldconfig -p | grep -q 'libasound\.so\.2'; then
            sudo apt-get update
            sudo apt-get install -y libasound2t64
          fi
          ldconfig -p | grep 'libasound\.so\.2'

      - name: Download the verified seed and native compiler
        uses: actions/download-artifact@v4
        with:
          name: selfhost-test-tools
          path: ${{ runner.temp }}/selfhost-tools

      - name: Compare this shard against the VM
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/selfhost-tools"
          {
            echo "### Verified tools — shard $SHARD"
            find "$tools" -maxdepth 4 -type f -print | sort
          } | tee -a "$GITHUB_STEP_SUMMARY"
          zett="$(find "$tools" -type f -name zett -print -quit)"
          compiler="$(find "$tools" -type f -name titanc1 -print -quit)"
          if [ -z "$zett" ] || [ -z "$compiler" ]; then
            echo "Missing verified Zett seed or native compiler in artifact" >&2
            exit 1
          fi
          chmod +x "$zett" "$compiler"
          mapfile -t files < <(
            find selfhost/tests/native -maxdepth 1 -type f -name '*.titan' -print \
              | sort \
              | awk -v shard="$SHARD" -v count=4 '((NR - 1) % count) == shard'
          )
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No native tests assigned to shard $SHARD" >&2
            exit 1
          fi
          COMPILER="$compiler" ZETT="$zett" \
            bash selfhost/native/verify_native.sh "${files[@]}"
