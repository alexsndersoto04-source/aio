name: Linux ARM64 (Termux)

# 1. En x86-64: bootstrap sin Rust, y la CLI `titan` se compila para ARM64 por LLVM (cruzado).
# 2. En un ARM64 de verdad (ubuntu-24.04-arm): el ejecutable se prueba, compila programas con LLVM y su salida se
#    compara con la del compilador x86-64 (selfhost/tests/arm64_diff.sh).
# Termux usa el mismo núcleo Linux sobre ARM64, pero esta CI no es un teléfono: ver selfhost/ESTADO.md.
on:
  push:
    branches: [ main, "arena/**" ]
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      etiqueta:
        description: "Etiqueta (vX.Y.Z) cuya release hay que (re)publicar con los paquetes. Combínala con .github/arm64-reuse-run para publicar una construcción ya hecha y probada."
        required: false
        default: ""

jobs:
  origen:
    name: origen de los artefactos
    runs-on: ubuntu-24.04
    outputs:
      reusar: ${{ steps.r.outputs.reusar }}
      etiqueta: ${{ steps.r.outputs.etiqueta }}
    steps:
      - uses: actions/checkout@v4
      - id: r
        env:
          ENTRADA_ETIQUETA: ${{ inputs.etiqueta }}
        run: |
          # Si existe .github/arm64-reuse-run (con un id de ejecución), se reutiliza esa construcción en vez de rehacerla.
          if [ -f .github/arm64-reuse-run ]; then echo "reusar=$(tr -dc 0-9 < .github/arm64-reuse-run)" >> "$GITHUB_OUTPUT"; else echo "reusar=" >> "$GITHUB_OUTPUT"; fi
          # Etiqueta cuya release hay que publicar: la del push de etiqueta; si no, la entrada
          # "etiqueta" de workflow_dispatch; si no, el archivo .github/publicar-etiqueta (para
          # re-publicar una release que quedó sin archivos, sin necesidad de mover la etiqueta).
          ET=""
          case "$GITHUB_REF" in refs/tags/v*) ET="$GITHUB_REF_NAME" ;; esac
          [ -n "$ET" ] || ET="${ENTRADA_ETIQUETA:-}"
          if [ -z "$ET" ] && [ -f .github/publicar-etiqueta ]; then ET="$(tr -d ' \t\r\n' < .github/publicar-etiqueta)"; fi
          echo "etiqueta=$ET" >> "$GITHUB_OUTPUT"
  construir:
    name: construir (x86-64 -> ARM64 cruzado)
    needs: origen
    if: ${{ needs.origen.outputs.reusar == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Instalar clang y lld
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang lld
      - name: Bootstrap (semilla -> titanc1 == titanc2 == titanc3 -> titan)
        run: bash selfhost/bootstrap.sh
      - name: Compilar titan para ARM64 (LLVM, cruzado)
        run: selfhost/titan compile selfhost/titan.titan -o titan-aarch64 --target aarch64
      - name: Compilar titan para ARM de 32 bits (LLVM, cruzado)
        run: |
          # Si falla, el error del compilador (que trae el del clang/lld de turno) se publica como
          # anotación: los registros de Actions no se pueden descargar desde fuera.
          set +e
          salida="$(selfhost/titan compile selfhost/titan.titan -o titan-armv7 --target armv7 2>&1)"
          rc=$?
          printf '%s\n' "$salida"
          if [ $rc -ne 0 ]; then
            msg=$(printf '%s' "$salida" | tail -c 3000 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=compilacion ARM32 (armv7)::$msg"
          fi
          exit $rc
      - name: Salidas del compilador x86-64 (referencia)
        run: bash selfhost/tests/arm64_diff.sh generar selfhost/titan x86out
      - name: Paquetes
        run: |
          bash selfhost/empaquetar.sh selfhost/titan x86_64 paquetes
          bash selfhost/empaquetar.sh titan-aarch64 aarch64 paquetes
          bash selfhost/empaquetar.sh titan-armv7 armv7 paquetes
      - name: Paquetes .deb (sistema y Termux) y repositorio apt
        run: |
          VER="$(grep -o 'v[0-9][0-9.]*' <(selfhost/titan version) | head -1 | sed 's/^v//')"
          mkdir -p paquetes/repo paquetes/repo-termux
          # Sistema (Debian/Ubuntu): amd64, arm64 y armhf (ARM de 32 bits).
          bash selfhost/empaquetar_deb.sh selfhost/titan amd64 paquetes/repo --version "$VER"
          bash selfhost/empaquetar_deb.sh titan-aarch64 arm64 paquetes/repo --version "$VER"
          bash selfhost/empaquetar_deb.sh titan-armv7 armhf paquetes/repo --version "$VER"
          # Termux: x86_64, aarch64 y arm (los mismos binarios, con su prefijo).
          bash selfhost/empaquetar_deb.sh selfhost/titan amd64 paquetes/repo-termux --termux --version "$VER"
          bash selfhost/empaquetar_deb.sh titan-aarch64 arm64 paquetes/repo-termux --termux --version "$VER"
          bash selfhost/empaquetar_deb.sh titan-armv7 armhf paquetes/repo-termux --termux --version "$VER"
          # Índices del repositorio (Packages, Packages.gz y Release) y la comprobación de que apt los lee.
          bash selfhost/repo_apt.sh paquetes/repo
          bash selfhost/repo_apt.sh paquetes/repo-termux --termux
          ls -la paquetes/repo paquetes/repo-termux
      - name: El paquete de ARM de 32 bits funciona (emulador de ARM32)
        run: |
          python3 -m pip install --quiet unicorn capstone
          VER="$(grep -o 'v[0-9][0-9.]*' <(selfhost/titan version) | head -1 | sed 's/^v//')"
          T="$(mktemp -d)"
          dpkg-deb -x "paquetes/repo/zett_${VER}_armhf.deb" "$T"
          python3 selfhost/native/arm32/correr.py "$T/usr/lib/zett/titan" version
          python3 selfhost/native/arm32/correr.py "$T/usr/lib/zett/zett" version
      - name: El paquete .deb de x86-64 se instala y funciona
        run: |
          L=/tmp/paquetes.list
          echo "deb [trusted=yes] file:$PWD/paquetes/repo ./" > "$L"
          sudo apt-get -o Dir::Etc::sourcelist="$L" -o Dir::Etc::sourceparts=/dev/null -o APT::Get::List-Cleanup=0 update
          sudo apt-get -o Dir::Etc::sourcelist="$L" -o Dir::Etc::sourceparts=/dev/null -o APT::Get::List-Cleanup=0 install -y zett
          dpkg -l zett | tail -1
          titan version
          zett version
          printf 'fn main() {\n    let n = 6 * 7\n    println("respuesta {n}")\n}\n' > /tmp/hola.titan
          test "$(titan run /tmp/hola.titan)" = "respuesta 42"
          # El gestor de paquetes del paquete instalado: clave nueva y paquete firmado.
          mkdir -p /tmp/proy/src && cp /tmp/hola.titan /tmp/proy/src/main.titan
          printf '[package]\nname = "prueba_ci"\nversion = "0.1.0"\nedition = "2026"\ndescription = "prueba"\nlicense = "MIT"\n' > /tmp/proy/Titan.toml
          zett keygen /tmp/k.key
          (cd /tmp/proy && zett pack --key /tmp/k.key --output /tmp/p.tpkg)
          test -s /tmp/p.tpkg
      - name: Los programas de ARM de 32 bits dan lo mismo que en x86-64 (emulador de ARM32)
        run: |
          # El binario de ARM 32 bits lo enlaza clang/lld de verdad, con coma
          # flotante por hardware: aquí se comprueban programas reales de
          # números. Los ayudantes de la RTABI (__aeabi_l2d, __aeabi_d2lz,
          # __aeabi_uldivmod...) los escribe el backend en el .ll, y si su ABI
          # no es la que clang espera el enlazado no se queja: solo salen
          # números mal. Esta prueba es la que lo ve.
          python3 -m pip install --quiet unicorn capstone
          bash selfhost/tests/arm32_diff.sh \
            selfhost/tests/native/decimales.titan \
            selfhost/tests/native/basico.titan
      - uses: actions/upload-artifact@v4
        with:
          name: arm64-entrada
          path: |
            titan-aarch64
            x86out
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: paquetes
          path: paquetes
          retention-days: 30

  probar:
    name: probar en ARM64 real
    needs: [origen, construir]
    if: ${{ always() && (needs.construir.result == 'success' || needs.construir.result == 'skipped') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Instalar clang y lld
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang lld
      - uses: actions/download-artifact@v4
        with:
          name: arm64-entrada
          run-id: ${{ needs.origen.outputs.reusar || github.run_id }}
          github-token: ${{ github.token }}
      - name: El ejecutable ARM64 arranca
        run: |
          uname -m
          cp titan-aarch64 selfhost/titan-arm
          chmod +x selfhost/titan-arm
          selfhost/titan-arm version
      - name: El paquete .deb de ARM64 se instala y funciona (aquí, en ARM64 de verdad)
        run: |
          VER="$(grep -o 'v[0-9][0-9.]*' <(selfhost/titan-arm version) | head -1 | sed 's/^v//')"
          mkdir -p paquetes/repo paquetes/repo-termux
          bash selfhost/empaquetar_deb.sh titan-aarch64 arm64 paquetes/repo --version "$VER"
          bash selfhost/empaquetar_deb.sh titan-aarch64 arm64 paquetes/repo-termux --termux --version "$VER"
          bash selfhost/repo_apt.sh paquetes/repo
          bash selfhost/repo_apt.sh paquetes/repo-termux --termux
          L=/tmp/paquetes.list
          echo "deb [trusted=yes] file:$PWD/paquetes/repo ./" > "$L"
          sudo apt-get -o Dir::Etc::sourcelist="$L" -o Dir::Etc::sourceparts=/dev/null -o APT::Get::List-Cleanup=0 update
          sudo apt-get -o Dir::Etc::sourcelist="$L" -o Dir::Etc::sourceparts=/dev/null -o APT::Get::List-Cleanup=0 install -y zett
          dpkg -l zett | tail -1
          uname -m
          titan version
          zett version
          printf 'fn main() {\n    let n = 6 * 7\n    println("respuesta {n}")\n}\n' > /tmp/hola.titan
          test "$(titan run /tmp/hola.titan)" = "respuesta 42"
          mkdir -p /tmp/proy/src && cp /tmp/hola.titan /tmp/proy/src/main.titan
          printf '[package]\nname = "prueba_ci_arm"\nversion = "0.1.0"\nedition = "2026"\ndescription = "prueba"\nlicense = "MIT"\n' > /tmp/proy/Titan.toml
          zett keygen /tmp/k.key
          (cd /tmp/proy && zett pack --key /tmp/k.key --output /tmp/p.tpkg)
          test -s /tmp/p.tpkg
      - name: Un programa compilado y ejecutado en ARM64
        run: |
          printf 'fn main() {\n    let n = 6 * 7\n    println("respuesta {n}")\n}\n' > /tmp/hola.titan
          test "$(selfhost/titan-arm run /tmp/hola.titan)" = "respuesta 42"
      - name: "zett (gestor de paquetes) y arranque invocado por el PATH en ARM64"
        run: |
          mkdir -p /tmp/bin
          ln -s "$PWD/selfhost/titan-arm" /tmp/bin/zett
          ln -s "$PWD/selfhost/titan-arm" /tmp/bin/titan
          export PATH=/tmp/bin:$PATH
          zett version | grep -q "zett (gestor de paquetes de Titan)"
          zett help | grep -q "uso: zett"
          test "$(titan run /tmp/hola.titan)" = "respuesta 42"
      - name: Procesos hijos y servidor HTTP en ARM64
        run: |
          selfhost/titan-arm run selfhost/tests/diag/arm_proc.titan > proc.out
          grep -q "8 fin" proc.out
          grep -q "200 OK" proc.out
      - name: Diferencial contra x86-64
        run: |
          bash selfhost/tests/arm64_diff.sh generar selfhost/titan-arm armout > generar.txt 2>&1
          rc=0
          bash selfhost/tests/arm64_diff.sh comparar x86out armout > comparar.txt 2>&1 || rc=$?
          cat generar.txt comparar.txt
          # La salida completa del log no se puede leer por API: se publica como anotación.
          msg=$(head -c 6000 comparar.txt | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
          if [ $rc -ne 0 ]; then
            echo "::error title=diferencial ARM64::$msg"
          else
            echo "::notice title=diferencial ARM64::$msg"
          fi
          exit $rc
      - name: titan compilado por titan en ARM64 (informativo)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          rc=0
          { time selfhost/titan-arm compile selfhost/titan.titan -o selfhost/titan-arm2; } > auto.txt 2>&1 || rc=$?
          { echo "compilación nativa: código $rc"; sha256sum titan-aarch64 selfhost/titan-arm2; cmp titan-aarch64 selfhost/titan-arm2 && echo "IGUALES: coincide con el cruzado"; } >> auto.txt 2>&1 || true
          cat auto.txt
          msg=$(head -c 3000 auto.txt | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
          echo "::notice title=autocompilacion ARM64::$msg"
          test $rc -eq 0
          cp selfhost/titan-arm2 selfhost/titan-arm
          test "$(selfhost/titan-arm run /tmp/hola.titan)" = "respuesta 42"

  publicar:
    name: publicar los paquetes (solo en etiquetas v*)
    # Corre con una etiqueta (push de tag, entrada de workflow_dispatch o .github/publicar-etiqueta)
    # y con las pruebas en ARM64 real en verde. «!cancelled()» permite publicar también cuando
    # «construir» se saltó por reutilizar una construcción anterior (.github/arm64-reuse-run).
    if: ${{ !cancelled() && needs.probar.result == 'success' && needs.origen.outputs.etiqueta != '' }}
    needs: [origen, construir, probar]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TAG: ${{ needs.origen.outputs.etiqueta }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: paquetes
          path: paquetes
          run-id: ${{ needs.origen.outputs.reusar || github.run_id }}
          github-token: ${{ github.token }}
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd paquetes
          # Nombres fijos para que instalar-termux.sh encuentre siempre «latest/download/…».
          cp titan-*-linux-aarch64.tar.gz titan-linux-aarch64.tar.gz
          cp titan-*-linux-x86_64.tar.gz titan-linux-x86_64.tar.gz
          cp titan-*-linux-armv7.tar.gz titan-linux-armv7.tar.gz
          cp repo/*.deb repo-termux/*.deb . 2> /dev/null || true
          # Copias sin versión: las páginas y el README enlazan siempre «latest/download/zett_amd64.deb».
          cp "zett_${TAG#v}_amd64.deb" zett_amd64.deb 2> /dev/null || true
          cp "zett_${TAG#v}_arm64.deb" zett_arm64.deb 2> /dev/null || true
          cp "zett_${TAG#v}_armhf.deb" zett_armhf.deb 2> /dev/null || true
          cp "zett_${TAG#v}_x86_64.termux.deb" zett_x86_64.termux.deb 2> /dev/null || true
          cp "zett_${TAG#v}_aarch64.termux.deb" zett_aarch64.termux.deb 2> /dev/null || true
          cp "zett_${TAG#v}_arm.termux.deb" zett_arm.termux.deb 2> /dev/null || true
          sha256sum titan-linux-*.tar.gz zett_*.deb > SHA256SUMS.txt
          ARCHIVOS=(SHA256SUMS.txt titan-linux-aarch64.tar.gz titan-linux-x86_64.tar.gz titan-linux-armv7.tar.gz titan-*-linux-aarch64.tar.gz titan-*-linux-x86_64.tar.gz titan-*-linux-armv7.tar.gz zett_*.deb)
          # Si la release ya existe (por ejemplo, creada a mano en la web antes de que la CI
          # terminara, justo lo que dejó v1.3.0 sin archivos), se le suben los paquetes encima
          # (--clobber reemplaza los de igual nombre) en vez de fallar con «release already exists».
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "${ARCHIVOS[@]}"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "Titan $TAG" \
              --notes "Construida con el compilador escrito en Titan, sin Rust (las versiones 1.0.x son del prototipo en Rust). Incluye zett, el gestor de paquetes (enlace a titan). Paquetes .deb para Debian/Ubuntu (amd64, arm64, armhf) y para Termux (x86_64, aarch64, arm): se instalan con apt, que deja titan y zett en el PATH; el repositorio apt se publica en la rama zett-repo (sistema/ y termux/). El paquete de ARM64 se probó en un servidor ARM64 real (no en un teléfono) y el de ARM de 32 bits bajo el emulador; el de x86-64 en la propia CI. También están los tar.gz de siempre, que no necesitan instalación. SHA256SUMS.txt trae las sumas de verificación." \
              "${ARCHIVOS[@]}"
          fi
      - name: Publicar el repositorio apt en la rama zett-repo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          rm -rf repo-branch
          if git ls-remote --exit-code --heads "$URL" zett-repo > /dev/null 2>&1; then
            git clone --depth 1 --branch zett-repo "$URL" repo-branch
          else
            git clone --depth 1 "$URL" repo-branch
            ( cd repo-branch && git checkout --orphan zett-repo && git rm -rf . > /dev/null 2>&1 || true )
          fi
          # El repositorio del sistema y el de Termux van en carpetas distintas: cada uno tiene sus
          # propios nombres de arquitectura y su propio índice (Packages y Release).
          mkdir -p repo-branch/sistema repo-branch/termux
          cp paquetes/repo/* repo-branch/sistema/
          cp paquetes/repo-termux/* repo-branch/termux/
          cd repo-branch
          git add -A
          git commit -m "Paquetes zett ${TAG:-$GITHUB_SHA}" || echo "el repositorio no cambió"
          git push origin HEAD:zett-repo
