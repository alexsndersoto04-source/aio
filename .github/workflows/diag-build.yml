name: Diag build errors

# Temporal: el host de logs de Actions no es alcanzable desde el sandbox,
# asi que este job publica la salida de cargo como anotaciones del check-run,
# que si se pueden leer por API. Se borra cuando la verificacion quede completa.

on:
  push:
    branches: [ "arena/**" ]

env:
  RUSTFLAGS: "-D warnings"

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run the audio tests and publish their names
        run: |
          set +e
          cargo test -p titan_stdlib --lib audio_mod -- --nocapture > /tmp/audio.log 2>&1
          export AUDIO_CODE=$?
          cargo check --workspace --all-targets > /tmp/check.log 2>&1
          export CHECK_CODE=$?
          set -e

          echo "audio=$AUDIO_CODE check=$CHECK_CODE"

          python3 - <<'PY'
          import os

          def emit(label, path, keep):
              try:
                  with open(path, errors='replace') as handle:
                      data = handle.read()
              except OSError:
                  data = '<falta el archivo>'
              picked = [line for line in data.splitlines()
                        if any(tag in line for tag in keep)]
              if not picked:
                  picked = data.splitlines()[-40:]
              body = '\n'.join(picked[-60:])
              body = body.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error::%s%s' % (label, body[:3800]))

          emit('AUDIO(exit=%s) ' % os.environ['AUDIO_CODE'], '/tmp/audio.log',
               ('running ', 'test audio_mod', 'test result', 'panicked', 'error'))
          emit('CHECK(exit=%s) ' % os.environ['CHECK_CODE'], '/tmp/check.log',
               ('error', 'warning', '-->'))

          if os.environ['AUDIO_CODE'] != '0' or os.environ['CHECK_CODE'] != '0':
              raise SystemExit(1)
          PY
