name: Diag build errors

# Temporal: el host de logs de Actions no es alcanzable desde el sandbox,
# asi que este job publica la salida cruda de cargo como anotaciones del
# check-run, que si se pueden leer por API. Se borra cuando el build quede verde.

on:
  push:
    branches: [ "arena/**" ]

env:
  RUSTFLAGS: "-D warnings"

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Dump cargo output as annotations
        run: |
          set +e
          cargo check --workspace --all-targets > /tmp/check.log 2>&1
          export CHECK_CODE=$?
          cargo test --workspace --all-targets --no-fail-fast > /tmp/test.log 2>&1
          export TEST_CODE=$?
          set -e

          echo "check=$CHECK_CODE test=$TEST_CODE"

          python3 - <<'PY'
          import os

          def emit(label, path):
              try:
                  with open(path, errors='replace') as handle:
                      data = handle.read()
              except OSError:
                  data = '<falta el archivo>'
              interesting = []
              for line in data.splitlines():
                  if any(tag in line for tag in ('error', 'warning', 'failures', 'test result', 'panicked', '-->')):
                      interesting.append(line)
              if not interesting:
                  interesting = data.splitlines()
              body = '\n'.join(interesting[-45:])
              body = body.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error::%s%s' % (label, body[:3500]))

          emit('CHECK(exit=%s) ' % os.environ['CHECK_CODE'], '/tmp/check.log')
          emit('TEST(exit=%s) ' % os.environ['TEST_CODE'], '/tmp/test.log')

          if os.environ['CHECK_CODE'] != '0' or os.environ['TEST_CODE'] != '0':
              raise SystemExit(1)
          PY
