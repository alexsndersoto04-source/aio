name: LLVM backend (Titan -> LLVM IR -> clang)

# Backend LLVM del compilador escrito en Titan (selfhost/native/llvm.titan).
# El sandbox de desarrollo no tiene LLVM; aquí sí (LLVM real de Ubuntu).
# Cada prueba: el compilador en Titan genera LLVM IR (.ll), clang lo convierte
# en ejecutable, y la salida se compara byte a byte con el Zett precompilado
# verificado (VM de Rust). No se compila Titan con Cargo para esta prueba.

on:
  push:
    branches: [main, 'arena/**']
    paths:
      - 'selfhost/**'
      - '.github/workflows/llvm.yml'

jobs:
  llvm:
    # En una ejecución dedicada a ARM64 real, no lanzar la batería x86 que ya
    # se valida localmente ni compilar la VM con Cargo.
    if: ${{ !contains(github.event.head_commit.message, '[arm64-real-only]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Herramientas LLVM disponibles
        run: |
          set +e
          for t in clang clang-18 clang-17 clang-16 clang-15 clang-14 llc llc-18 opt opt-18 lld ld.lld llvm-config llvm-config-18 qemu-aarch64 qemu-aarch64-static; do
            p=$(command -v $t)
            if [ -n "$p" ]; then echo "$t: $p :: $($t --version 2>&1 | head -1)"; else echo "$t: (no)"; fi
          done > /tmp/tools.txt
          cat /tmp/tools.txt
          # Anotaciones: se leen por la API sin descargar el log.
          echo "::notice::herramientas: $(grep -v '(no)' /tmp/tools.txt | sed 's/ :: .*//' | tr '\n' ' ')"
          echo "::notice::clang: $(clang --version 2>&1 | head -1)"
          ls /usr/lib/llvm-*/bin 2>/dev/null | head -50
          clang -print-targets 2>/dev/null | grep -Ei "x86-64|aarch64" | head

      - name: Require genuine ALSA runtime library
        shell: bash
        run: |
          set -euo pipefail
          if ! ldconfig -p | grep -q 'libasound\.so\.2'; then
            sudo apt-get update
            sudo apt-get install -y libasound2t64
          fi
          ldconfig -p | grep 'libasound\.so\.2'

      - name: Download the precompiled Zett seed and verify its SHA-256
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/binaries:refs/remotes/origin/binaries
          seed="$RUNNER_TEMP/zett"
          git show origin/binaries:zett-linux-x86_64 > "$seed"
          chmod +x "$seed"
          expected="$(git show origin/binaries:zett-linux-x86_64.sha256 | awk 'NR == 1 {print $1}')"
          printf '%s  %s\n' "$expected" "$seed" | sha256sum --check
          printf '%s\n' "$expected" > "$RUNNER_TEMP/zett.sha256"
          printf 'Seed source commit: '
          git show origin/binaries:COMMIT 2>/dev/null || true
          "$seed" version

      - name: Batería LLVM contra el Zett verificado
        shell: bash
        run: |
          set -euo pipefail
          if [ -f selfhost/native/llvm/verificar.sh ]; then
            if ZETT="$RUNNER_TEMP/zett" bash selfhost/native/llvm/verificar.sh 2>&1 | tee /tmp/llvm.txt; then
              rc=0
            else
              rc=${PIPESTATUS[0]}
            fi
            python3 selfhost/native/llvm/resumen_ci.py /tmp/llvm.txt
            exit "$rc"
          else
            echo "todavía no hay selfhost/native/llvm/verificar.sh"
          fi

  # ARM64, parte 1 (x86-64): el compilador en Titan escribe el IR para AArch64
  # y clang lo convierte en objetos ARM64.
  arm64-objetos:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Require genuine ALSA and download verified Zett
        shell: bash
        run: |
          set -euo pipefail
          if ! ldconfig -p | grep -q 'libasound\.so\.2'; then
            sudo apt-get update
            sudo apt-get install -y libasound2t64
          fi
          ldconfig -p | grep 'libasound\.so\.2'
          git fetch --no-tags origin +refs/heads/binaries:refs/remotes/origin/binaries
          seed="$RUNNER_TEMP/zett"
          git show origin/binaries:zett-linux-x86_64 > "$seed"
          chmod +x "$seed"
          expected="$(git show origin/binaries:zett-linux-x86_64.sha256 | awk 'NR == 1 {print $1}')"
          printf '%s  %s\n' "$expected" "$seed" | sha256sum --check
          printf 'Seed source commit: '
          git show origin/binaries:COMMIT 2>/dev/null || true
          "$seed" version
          mkdir -p "$HOME/bin"
          ln -sf "$seed" "$HOME/bin/zett"

      - name: Objetos ARM64 (Titan -> LLVM IR -> clang --target=aarch64)
        run: |
          export PATH="$HOME/bin:$PATH"
          bash selfhost/native/llvm/arm64_objetos.sh /tmp/a64 2>&1 | tee /tmp/obj.txt
          rc=${PIPESTATUS[0]}
          tail -2 /tmp/obj.txt | while IFS= read -r l; do echo "::notice::[arm64-objetos] $l"; done
          grep "^LLVM rechazó" /tmp/obj.txt | head -5 | while IFS= read -r l; do echo "::error::[arm64-objetos] $l"; done
          exit $rc

      - name: Referencias de la VM precompilada x86-64
        run: |
          export PATH="$HOME/bin:$PATH"
          bash selfhost/native/llvm/arm64_referencias.sh /tmp/a64 2>&1 | tee /tmp/ref.txt
          rc=${PIPESTATUS[0]}
          tail -1 /tmp/ref.txt | while IFS= read -r l; do echo "::notice::[arm64-referencias] $l"; done
          grep "^TIEMPO AGOTADO" /tmp/ref.txt | head -5 | while IFS= read -r l; do echo "::error::[arm64-referencias] $l"; done
          exit $rc

      - uses: actions/upload-artifact@v4
        with:
          name: arm64-objetos
          path: /tmp/a64
          retention-days: 3

  # ARM64, parte 2: el runner ARM64 real ejecuta los ELF AArch64 y compara
  # con referencias generadas por el Zett x86-64 precompilado de este commit.
  arm64:
    needs: arm64-objetos
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: arm64-objetos
          path: /tmp/a64

      - name: Batería ARM64 en hardware real
        run: |
          machine=$(uname -m)
          echo "::notice::máquina: $machine $(uname -r); referencia: VM x86-64 precompilada"
          if [ "$machine" != aarch64 ]; then
            echo "::error::el job requiere hardware AArch64 real; uname -m=$machine"
            exit 1
          fi
          bash selfhost/native/llvm/arm64_comparar.sh /tmp/a64 2>&1 | tee /tmp/arm.txt
          rc=${PIPESTATUS[0]}
          python3 selfhost/native/llvm/resumen_ci.py /tmp/arm.txt
          exit $rc

  # Sin sistema operativo (aarch64-none): cada programa arranca solo en una
  # máquina ARM64 "virt" de QEMU de verdad (MMU, puerto serie PL011, apagado
  # por PSCI) y su salida se compara con la VM de Rust. Después, lo mismo en
  # unicorn (el motor de QEMU), que además da el código de salida.
  sin-so:
    # No ejecutar emulación QEMU/Unicorn en la validación de ARM64 real.
    if: ${{ !contains(github.event.head_commit.message, '[arm64-real-only]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update >/dev/null
          if ! ldconfig -p | grep -q 'libasound\.so\.2'; then
            sudo apt-get install -y libasound2t64 >/dev/null
          fi
          ldconfig -p | grep 'libasound\.so\.2'
          sudo apt-get install -y --no-install-recommends qemu-system-arm lld >/dev/null
          pip install --user --break-system-packages unicorn >/dev/null
          echo "::notice::$(qemu-system-aarch64 --version | head -1); $(clang --version | head -1); $(ld.lld --version)"

      - name: Download the precompiled Zett seed and verify its SHA-256
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/binaries:refs/remotes/origin/binaries
          seed="$RUNNER_TEMP/zett"
          git show origin/binaries:zett-linux-x86_64 > "$seed"
          chmod +x "$seed"
          expected="$(git show origin/binaries:zett-linux-x86_64.sha256 | awk 'NR == 1 {print $1}')"
          printf '%s  %s\n' "$expected" "$seed" | sha256sum --check
          printf 'Seed source commit: '
          git show origin/binaries:COMMIT 2>/dev/null || true
          "$seed" version
          mkdir -p "$HOME/bin"
          ln -sf "$seed" "$HOME/bin/zett"

      - name: Programas sin sistema operativo en QEMU
        run: |
          export PATH="$HOME/bin:$PATH"
          CORRER=qemu bash selfhost/native/bare/probar.sh 2>&1 | tee /tmp/qemu.txt
          rc=${PIPESTATUS[0]}
          tail -1 /tmp/qemu.txt | while IFS= read -r l; do echo "::notice::[qemu] $l"; done
          grep "^DIFERENCIA\|^no admitido" /tmp/qemu.txt | head -8 | while IFS= read -r l; do echo "::error::[qemu] $l"; done
          exit $rc

      - name: Programas sin sistema operativo en unicorn (con código de salida)
        if: always()
        run: |
          export PATH="$HOME/bin:$PATH"
          CORRER=unicorn bash selfhost/native/bare/probar.sh 2>&1 | tee /tmp/uni.txt
          rc=${PIPESTATUS[0]}
          tail -1 /tmp/uni.txt | while IFS= read -r l; do echo "::notice::[unicorn] $l"; done
          grep "^DIFERENCIA\|^no admitido" /tmp/uni.txt | head -8 | while IFS= read -r l; do echo "::error::[unicorn] $l"; done
          exit $rc
