name: Titan official site · GitHub Pages

on:
  push:
    branches: [main, "arena/01a0df76-aio"]
    paths:
      - "site/**"
      - "scripts/validate_site.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: titan-pages
  cancel-in-progress: true

jobs:
  deploy:
    # Pushes deploy main or the fixed feature branch; manual dispatch also
    # supports pre-merge Pages validation from its selected ref.
    if: >-
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/arena/01a0df76-aio' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate static site, links, and translations
        run: python3 scripts/validate_site.py

      # A repository administrator must enable Pages once in Settings → Pages,
      # with GitHub Actions as the deployment source.
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
