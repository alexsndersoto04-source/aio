# Trae un `zett` funcional a un sandbox con red filtrada.
#
# Contexto: en sandboxes como el de Arena el host de releases de GitHub
# (release-assets.githubusercontent.com) esta bloqueado, y tambien
# static.rust-lang.org y crates.io, asi que ahi no se puede ni descargar el
# binario del release ni compilar desde fuente. Lo que SI pasa el filtro es
# git (github.com / api.github.com / codeload), y los runners de Actions si
# tienen Rust e internet. Este workflow une las dos puntas:
#
#   1. compila titan_cli dentro de ubuntu:22.04 (glibc 2.35, asi el binario
#      corre en glibc >= 2.35 en vez de quedar atado a la glibc del runner);
#   2. lo commitea en la rama `sandbox-zett-bin` (NUNCA en la rama de
#      trabajo: los binarios no ensucian el historial del proyecto);
#   3. el sandbox lo recupera con `git fetch` + `git show` y lo descomprime.
#
# Si el job falla, el reporte de diagnostico va a la rama `sandbox-zett-diag`
# (mismo mecanismo, distinta rama).
#
# Disparo: cuando cambia ESTE archivo (en cualquier rama arena/**), o a mano
# desde la UI de Actions (workflow_dispatch). El commit del binario va a otra
# rama y lleva [skip ci], asi que no entra en bucle.
#
# Nota: `shell: bash` implica `bash -eo pipefail`, asi que aca no se usan
# tuberias hacia `head` (SIGPIPE -> 141); se escribe a archivo y se lee con sed.

name: zett-sandbox-build

on:
  push:
    branches: ["arena/**"]
    paths: [".github/workflows/zett-sandbox-build.yml"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "5"

defaults:
  run:
    shell: bash

jobs:
  build:
    name: zett x86_64 (glibc 2.35)
    runs-on: ubuntu-latest
    container:
      image: ubuntu:22.04
    steps:
      - name: Dependencias del sistema
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            ca-certificates curl git xz-utils binutils \
            build-essential pkg-config \
            libx11-dev libxcb1-dev libxkbcommon-dev libasound2-dev \
            libudev-dev libssl-dev
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/checkout@v4

      - name: Rust estable
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup.sh
          sh /tmp/rustup.sh -y --profile minimal --default-toolchain stable
          # `. cargo/env` es para ESTE paso; `$GITHUB_PATH` recien rige en los
          # pasos siguientes. Sin el source, `rustc -V` muere con 127.
          . "$HOME/.cargo/env"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustc -V
          cargo -V

      - name: Cache cargo/target
        uses: Swatinem/rust-cache@v2
        continue-on-error: true
        with:
          save-if: "always"

      - name: cargo build --release -p titan_cli
        run: |
          set -o pipefail
          cargo build --release -p titan_cli 2>&1 | tee /tmp/build.log

      # Todo lo que se averigua del binario va a /tmp/reporte.txt: como los logs
      # de Actions no son legibles desde un sandbox con red filtrada, este
      # archivo se commitea SI EL JOB FALLA (paso final) y se lee con la API de
      # GitHub. En exito no se commitea nada de diagnostico: la prueba es el
      # propio binario funcionando.
      - name: Verificar binario antes de publicar
        run: |
          bin=target/release/titan
          rep=/tmp/reporte.txt
          {
            echo "=== fecha: $(date -u +%FT%TZ)"
            echo "=== ldd --version"
            ldd --version 2>&1 | sed -n '1,2p'
            echo "=== binario sin strip"
            ls -l "$bin"
            echo "=== strip"
            strip "$bin" && echo "strip OK"
            ls -l "$bin"
            echo "=== glibc maxima requerida (top 5)"
            objdump -T "$bin" > /tmp/dyn.txt 2>&1 || echo "objdump fallo"
            grep -o 'GLIBC_[0-9]*\.[0-9]*' /tmp/dyn.txt | sort -uV | tail -5 || echo "(sin refs GLIBC)"
            echo "=== librerias enlazadas"
            ldd "$bin" 2>&1
            echo "=== titan version"
            "$bin" version 2>&1 || echo "FALLO: titan version (exit $?)"
            echo "=== titan run hola.titan"
            printf 'fn main() {\n    print("hola desde zett")\n}\n' > /tmp/hi.titan
            "$bin" run /tmp/hi.titan 2>&1 || echo "FALLO: titan run (exit $?)"
          } > "$rep" 2>&1
          cat "$rep"

      - name: Empaquetar
        run: |
          mkdir -p tools
          cp target/release/titan tools/zett
          tar -cJf tools/zett-linux-x86_64.tar.xz -C tools zett
          rm tools/zett
          (cd tools && sha256sum zett-linux-x86_64.tar.xz > zett-linux-x86_64.tar.xz.sha256)
          ls -l tools/
          cat tools/zett-linux-x86_64.tar.xz.sha256

      # Los binarios van SIEMPRE a la rama de artefactos, nunca a la rama de
      # trabajo (el historial del proyecto no tiene por que arrastrar tarballs).
      - name: Publicar binario en la rama de artefactos
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898530+github-actions[bot]@users.noreply.github.com"
          git fetch origin "${GITHUB_REF_NAME}"
          git checkout -B zett-bin FETCH_HEAD
          git add -f tools/zett-linux-x86_64.tar.xz tools/zett-linux-x86_64.tar.xz.sha256
          git commit -m "ci: zett x86_64 (glibc 2.35) para el sandbox [skip ci]"
          git push --force origin "HEAD:refs/heads/sandbox-zett-bin"

      # Solo ante un fallo: es el canal de diagnostico cuando el sandbox no
      # puede leer los logs de Actions.
      - name: Publicar reporte de diagnostico (solo si fallo)
        if: failure()
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE" || true
          mkdir -p tools
          {
            echo "### reporte del job"
            cat /tmp/reporte.txt 2>/dev/null || echo "(sin reporte)"
            echo
            echo "### ultimas 120 lineas del build"
            tail -n 120 /tmp/build.log 2>/dev/null || echo "(sin build.log)"
          } > tools/ci-reporte.txt 2>/dev/null || echo "fallo armando el reporte" > tools/ci-reporte.txt
          git config user.name  "github-actions[bot]" || true
          git config user.email "41898530+github-actions[bot]@users.noreply.github.com" || true
          git fetch origin "${GITHUB_REF_NAME}" || true
          git checkout -B zett-reporte FETCH_HEAD 2>/dev/null || git checkout -B zett-reporte 2>/dev/null || true
          git add -f tools/ci-reporte.txt || true
          git commit -m "ci: reporte de diagnostico del build [skip ci]" || true
          git push --force origin "HEAD:refs/heads/sandbox-zett-diag" || echo "no se pudo publicar el reporte"
