# Compila `zett` (crate titan_cli) contra una glibc ANTIGUA para que el binario
# corra en entornos con glibc viejo. El binario oficial del release v1.0.0 se
# construye en `ubuntu-latest` y por eso no necesariamente arranca en, por
# ejemplo, Debian 12 / glibc 2.36.
#
# Este workflow se construye dentro de `ubuntu:22.04` (glibc 2.35): cualquier
# binario que enlace ahí corre en glibc >= 2.35.
#
# El resultado NO se sube como artifact ni como release: en sandboxes con red
# filtrada esos hosts están bloqueados y `git` es el único canal disponible, así
# que el binario se commitea en la rama y se recupera con `git fetch`.
#
# Disparo: solo cuando cambia ESTE archivo en la rama de trabajo, para que no se
# ejecute en cada push ni entre en bucle con su propio commit de publicación.
#
# Nota: `shell: bash` implica `bash -eo pipefail`, así que acá no se usan
# tuberías hacia `head` (SIGPIPE -> 141); se escribe a archivo y se lee con sed.

name: zett-sandbox-build

on:
  push:
    branches: ["arena/01a0d172-aio"]
    paths: [".github/workflows/zett-sandbox-build.yml"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "5"

defaults:
  run:
    shell: bash

jobs:
  build:
    name: zett x86_64 (glibc 2.35)
    runs-on: ubuntu-latest
    container:
      image: ubuntu:22.04
    steps:
      - name: Dependencias del sistema
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            ca-certificates curl git xz-utils binutils \
            build-essential pkg-config \
            libx11-dev libxcb1-dev libxkbcommon-dev libasound2-dev \
            libudev-dev libssl-dev
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/checkout@v4

      - name: Rust estable
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup.sh
          sh /tmp/rustup.sh -y --profile minimal --default-toolchain stable
          . "$HOME/.cargo/env"
          rustc -V
          cargo -V

      - name: Cache cargo/target
        uses: Swatinem/rust-cache@v2
        continue-on-error: true
        with:
          save-if: "always"

      - name: cargo build --release -p titan_cli
        run: |
          . "$HOME/.cargo/env"
          set -o pipefail
          cargo build --release -p titan_cli 2>&1 | tee /tmp/build.log

      # Todo lo que se averigua del binario va a /tmp/reporte.txt: como los logs
      # de Actions no son legibles desde el sandbox, este archivo se commitea al
      # final (pase o no el job) y se lee con la API de GitHub.
      - name: Verificar binario antes de publicar
        run: |
          bin=target/release/titan
          rep=/tmp/reporte.txt
          {
            echo "=== fecha: $(date -u +%FT%TZ)"
            echo "=== ldd --version"
            ldd --version 2>&1 | sed -n '1,2p'
            echo "=== binario sin strip"
            ls -l "$bin"
            echo "=== strip"
            strip "$bin" && echo "strip OK"
            ls -l "$bin"
            echo "=== glibc maxima requerida (top 5)"
            objdump -T "$bin" > /tmp/dyn.txt 2>&1 || echo "objdump fallo"
            grep -o 'GLIBC_[0-9]*\.[0-9]*' /tmp/dyn.txt | sort -uV | tail -5 || echo "(sin refs GLIBC)"
            echo "=== librerias enlazadas"
            ldd "$bin" 2>&1
            echo "=== titan version"
            "$bin" version 2>&1 || echo "FALLO: titan version (exit $?)"
            echo "=== titan run hola.titan"
            printf 'fn main() {\n    print("hola desde zett")\n}\n' > /tmp/hi.titan
            "$bin" run /tmp/hi.titan 2>&1 || echo "FALLO: titan run (exit $?)"
          } > "$rep" 2>&1
          cat "$rep"

      - name: Empaquetar
        run: |
          mkdir -p tools
          cp target/release/titan tools/zett
          tar -cJf tools/zett-linux-x86_64.tar.xz -C tools zett
          rm tools/zett
          (cd tools && sha256sum zett-linux-x86_64.tar.xz > zett-linux-x86_64.tar.xz.sha256)
          ls -l tools/
          cat tools/zett-linux-x86_64.tar.xz.sha256

      - name: Publicar binario en la rama
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898530+github-actions[bot]@users.noreply.github.com"
          git fetch origin arena/01a0d172-aio
          git checkout -B zett-bin FETCH_HEAD
          git add -f tools/zett-linux-x86_64.tar.xz tools/zett-linux-x86_64.tar.xz.sha256
          git commit -m "ci: zett x86_64 (glibc 2.35) para el sandbox [skip ci]"
          git push origin HEAD:arena/01a0d172-aio

      # Corre SIEMPRE: es el canal de diagnostico del sandbox (no puede leer los
      # logs de Actions porque viven en un host bloqueado).
      - name: Publicar reporte de diagnostico
        if: always()
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE" || true
          mkdir -p tools
          {
            echo "### reporte del job"
            cat /tmp/reporte.txt 2>/dev/null || echo "(sin reporte)"
            echo
            echo "### ultimas 120 lineas del build"
            tail -n 120 /tmp/build.log 2>/dev/null || echo "(sin build.log)"
          } > tools/ci-reporte.txt 2>/dev/null || echo "fallo armando el reporte" > tools/ci-reporte.txt
          git config user.name  "github-actions[bot]" || true
          git config user.email "41898530+github-actions[bot]@users.noreply.github.com" || true
          git fetch origin arena/01a0d172-aio || true
          git checkout -B zett-reporte FETCH_HEAD 2>/dev/null || git checkout -B zett-reporte 2>/dev/null || true
          git add -f tools/ci-reporte.txt || true
          git commit -m "ci: reporte de diagnostico del build [skip ci]" || true
          git push origin HEAD:arena/01a0d172-aio || echo "no se pudo publicar el reporte"
